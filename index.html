<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>رباتساز هوشمند</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#7a828a);
  --ac:var(--tg-theme-button-color,#2f7cf6);
  --act:var(--tg-theme-button-text-color,#fff);
  --red:#e5484d; --green:#2fa36b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;background:var(--bg2);color:var(--tx);
  font-size:15px;line-height:1.7;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px}
.top h1{font-size:18px;font-weight:700}
.chip{font-size:12px;background:var(--bg);color:var(--hint);padding:3px 11px;border-radius:99px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:8px}
.muted{color:var(--hint);font-size:13px}
button{font:inherit;border:0;border-radius:11px;padding:11px 16px;cursor:pointer;background:var(--ac);color:var(--act);width:100%}
button.ghost{background:var(--bg2);color:var(--tx)}
button.danger{background:transparent;color:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
textarea,input{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 12px;outline:none;resize:none}
textarea{min-height:110px}
input{direction:ltr;text-align:left}
.bot{display:flex;align-items:center;gap:10px;cursor:pointer}
.bot b{display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hint);flex:none}
.dot.on{background:var(--green)}
.back{background:none;color:var(--ac);width:auto;padding:8px 2px;margin-bottom:2px}
.node{border-top:1px solid var(--bg2);padding:10px 0}
.node:first-of-type{border-top:0}
.node .id{font-size:12px;color:var(--hint);direction:ltr;text-align:right}
.node .tx{white-space:pre-wrap;margin:2px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;background:var(--bg2);border-radius:8px;padding:3px 10px}
.empty{text-align:center;padding:26px 8px}
.empty p{margin-bottom:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;
  border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.think{display:flex;gap:8px;background:linear-gradient(135deg,rgba(47,124,246,.09),rgba(47,124,246,.03));
  border:1px solid rgba(47,124,246,.16);border-radius:12px;padding:10px 12px;margin:-2px 0 12px;
  font-size:12.5px;line-height:1.65;color:var(--tx);opacity:0;max-height:0;overflow:hidden;
  transition:opacity .35s ease,max-height .35s ease,margin .35s ease,padding .35s ease}
.think.show{opacity:1;max-height:700px;margin:0 0 12px}
.think .ic{flex:none;font-size:14px;line-height:1.5}
.think .tt{color:var(--hint)}

/* ── انیمیشن «در حال فکر کردن» ── */
.live{background:linear-gradient(145deg,var(--bg),var(--bg2));border-radius:14px;padding:14px 16px;margin-bottom:12px;
  border:1px solid rgba(47,124,246,.06);animation:pop .35s cubic-bezier(.16,1,.3,1);position:relative}
.live::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac),#9b6bff,#34c3ff);opacity:.5}
.live-content{display:flex;align-items:center;gap:12px}
.live-indicator{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,rgba(47,124,246,.1),rgba(155,107,255,.1));display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.live-indicator::before{content:"";position:absolute;inset:-2px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#9b6bff);opacity:.12;animation:ringPulse 2.5s ease-out infinite}
.live-indicator svg{width:20px;height:20px;color:var(--ac);animation:rotate 3s linear infinite}
.live-text{flex:1;min-width:0}
.live-text p{font-size:13.5px;font-weight:500;color:var(--tx);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dots{display:flex;gap:3px;margin-left:auto;flex-shrink:0}
.live-dots span{width:5px;height:5px;border-radius:50%;background:rgba(47,124,246,.22);animation:dotWave 1.4s ease-in-out infinite}
.live-dots span:nth-child(2){animation-delay:.15s}
.live-dots span:nth-child(3){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:scale(.98) translateY(4px)}to{opacity:1;transform:none}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.12}50%{transform:scale(1.12);opacity:.04}100%{transform:scale(1);opacity:.12}}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes dotWave{0%,80%,100%{transform:scale(.7);opacity:.35}40%{transform:scale(1.2);opacity:1}}
@media (prefers-reduced-motion:reduce){.live-indicator::before,.live-indicator svg,.live-dots span{animation:none}}

/* ── ویرایشگر ── */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hd h2{margin:0}
button.sm{width:auto;padding:5px 11px;font-size:12.5px;border-radius:9px}
button.x{background:transparent;color:var(--red);padding:5px 9px}
.lbl{display:block;font-size:12.5px;color:var(--hint);margin:12px 0 4px}
input.fa,textarea.fa{direction:rtl;text-align:right}
input[type=checkbox]{width:auto;flex:none;margin:0}
select{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 10px;outline:none;min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:12px}
.tag{font-size:11px;background:var(--bg2);border-radius:6px;padding:1px 8px;color:var(--hint)}
.nd .nh{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.nd .nh b{font-size:14px;margin-inline-end:auto}
.bubble{position:relative;background:var(--bg2);border-radius:14px;padding:10px 12px 10px 34px;white-space:pre-wrap;cursor:pointer;
  border:1px solid transparent;transition:border-color .15s}
.bubble:active{border-color:var(--ac)}
.bubble .pen{position:absolute;left:10px;top:9px;font-size:13px;opacity:.55}
.krow{display:flex;gap:6px;margin-top:6px}
button.kb{flex:1;min-width:0;background:var(--bg2);color:var(--tx);padding:8px 6px;font-size:13.5px;border-radius:10px;
  border:1px solid rgba(127,127,127,.2);line-height:1.5}
button.kb:active{border-color:var(--ac)}
button.kb small{display:block;color:var(--hint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.kb.add{flex:0 0 40px;background:transparent;color:var(--ac);border:1px dashed var(--ac);font-size:15px}
button.kb.add.wide{display:block;width:100%;margin-top:6px;font-size:13px}
.cmd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cmd input{flex:1;min-width:0}.cmd .cmdn{flex:0 0 34%}
.bar{display:flex;gap:8px;margin-top:16px}
.bar button{flex:1}
button.danger-b{background:transparent;color:var(--red);border:1px solid rgba(229,72,77,.35)}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.show{display:block}
.sb{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fi .2s}
.sp{position:absolute;bottom:0;left:0;right:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s ease;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
#toast{z-index:99}

/* ── نوار پایین (Bottom Bar) ── */
.botbar{position:fixed;bottom:0;left:0;right:0;z-index:40;pointer-events:none}
.botbar-handle{pointer-events:auto;width:100%;height:56px;background:linear-gradient(180deg,rgba(255,255,255,0),var(--bg) 40%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.botbar-tab{width:44px;height:44px;border-radius:14px;background:var(--bg);border:1px solid rgba(47,124,246,.12);box-shadow:0 -4px 20px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s cubic-bezier(.16,1,.3,1);position:relative}
.botbar-tab::before{content:"";position:absolute;width:24px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ac),#9b6bff);opacity:.6;transition:opacity .25s}
.botbar-tab svg{width:22px;height:22px;color:var(--hint);transition:transform .3s cubic-bezier(.16,1,.3,1)}
.botbar-tab:hover{transform:translateY(-2px);box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.botbar.open .botbar-tab svg{transform:rotate(180deg)}
.botbar-panel{pointer-events:auto;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.12);transform:translateY(100%);opacity:0;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s;max-height:70vh;overflow-y:auto;padding:0 16px 0}
.botbar.open .botbar-panel{transform:translateY(0);opacity:1}
.botbar-content{padding:14px 0 calc(18px + env(safe-area-inset-bottom))}
.botbar-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid rgba(127,127,127,.1);margin-bottom:10px}
.botbar-header h3{font-size:16px;font-weight:600;color:var(--tx);margin:0}
.botbar-close{width:32px;height:32px;border-radius:10px;background:transparent;color:var(--hint);display:flex;align-items:center;justify-content:center;border:1px solid rgba(127,127,127,.15);cursor:pointer;transition:all .2s}
.botbar-close:hover{background:rgba(127,127,127,.08);color:var(--tx)}
.botbar-section{margin-bottom:16px}
.botbar-section-title{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px 4px;font-weight:600}
.botbar-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg2);cursor:pointer;transition:all .2s;border:1px solid transparent}
.botbar-item:hover{background:rgba(47,124,246,.06);border-color:rgba(47,124,246,.12)}
.botbar-item-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,rgba(47,124,246,.12),rgba(155,107,255,.12));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.botbar-item-icon svg{width:20px;height:20px;color:var(--ac)}
.botbar-item-text{flex:1;min-width:0}
.botbar-item-title{font-size:14.5px;font-weight:500;color:var(--tx);margin:0 0 2px}
.botbar-item-desc{font-size:12px;color:var(--hint);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.botbar-divider{height:1px;background:rgba(127,127,127,.08);margin:12px 0}
@media (prefers-reduced-motion:reduce){.botbar-tab,.botbar-panel,.botbar-item{transition:none}}
</style>
</head>
<body>
<div class="top"><h1>🤖 رباتساز هوشمند</h1><span class="chip" id="quota"></span></div>
<div id="app"></div>
<div id="sheet" class="sheet"></div>
<div id="toast"></div>

<!-- Bottom Bar -->
<div class="botbar" id="botbar">
  <div class="botbar-handle">
    <div class="botbar-tab" id="botbarTab" aria-label="باز کردن منو">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
  </div>
  <div class="botbar-panel" id="botbarPanel">
    <div class="botbar-content">
      <div class="botbar-header">
        <h3>منوی کاربر</h3>
        <button class="botbar-close" id="botbarClose" aria-label="بستن">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="botbar-section">
        <p class="botbar-section-title">پروفایل</p>
        <div class="botbar-item" id="profileBtn">
          <div class="botbar-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div class="botbar-item-text">
            <p class="botbar-item-title">پروفایل کاربری</p>
            <p class="botbar-item-desc">مدیریت حساب و تنظیمات</p>
          </div>
        </div>
      </div>
      <div class="botbar-divider"></div>
      <div class="botbar-section">
        <p class="botbar-section-title">تنظیمات</p>
        <div class="botbar-item">
          <div class="botbar-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
          <div class="botbar-item-text">
            <p class="botbar-item-title">تنظیمات برنامه</p>
            <p class="botbar-item-desc">سفارشی‌سازی تجربه</p>
          </div>
        </div>
        <div class="botbar-item">
          <div class="botbar-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <div class="botbar-item-text">
            <p class="botbar-item-title">حریم خصوصی و امنیت</p>
            <p class="botbar-item-desc">کنترل داده‌ها و دسترسی‌ها</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const INIT = tg?.initData || "";
// خالی = همون دامنه‌ای که این صفحه ازش لود شده (حالت پیش‌فرض). فقط اگه index.html رو جدا هاست کردی آدرس بک‌اند رو بذار:
const API_BASE = "";
let S = { bots: [], quota: 0, limit: 0, maxBots: 3, view: "list", cur: null, busy: false, edit: null, dirty: false, fresh: false, botbarOpen: false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&","<":"<",">":">",'"':""","'":"'"}[c]));

/* Bottom Bar */
function toggleBotbar(force){
  S.botbarOpen = force !== undefined ? force : !S.botbarOpen;
  $("#botbar").classList.toggle("open", S.botbarOpen);
}
function initBotbar(){
  $("#botbarTab").addEventListener("click", () => toggleBotbar());
  $("#botbarClose").addEventListener("click", () => toggleBotbar(false));
  $("#botbarPanel").addEventListener("click", e => { if(e.target === $("#botbarPanel")) toggleBotbar(false); });
  $("#profileBtn")?.addEventListener("click", () => { toggleBotbar(false); openProfile(); });
}
function openProfile(){
  const u = tg?.initDataUnsafe?.user;
  const name = u ? (u.first_name + (u.last_name ? " " + u.last_name : "")) : "کاربر";
  const username = u?.username ? "@" + u.username : "تعیین نشده";
  const id = u?.id ? String(u.id) : "—";
  showSheet(`<div class="hd"><h2>پروفایل کاربری</h2><button class="sm x" data-x="close">✕</button></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 20px">
      <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#9b6bff);display:flex;align-items:center;justify-content:center;font-size:28px;color:white;font-weight:600">${esc(name.charAt(0).toUpperCase())}</div>
      <div style="text-align:center"><div style="font-size:17px;font-weight:600;color:var(--tx)">${esc(name)}</div><div style="font-size:13px;color:var(--hint);margin-top:2px">${esc(username)}</div><div style="font-size:11px;color:var(--hint);margin-top:6px;font-family:monospace;direction:ltr">ID: ${esc(id)}</div></div>
    </div>
    <div class="bar" style="margin-top:8px"><button class="ghost" data-x="close">بستن</button></div>`);
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2800); }

async function api(path, method="GET", body){
  const r = await fetch(API_BASE + path, { method, headers: {"Content-Type":"application/json","X-Init-Data":INIT}, body: body?JSON.stringify(body):undefined });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "خطا در ارتباط با سرور");
  return d;
}

async function load(){
  try{
    const d = await api("/api/me");
    S.bots = d.bots; S.quota = d.quota; S.limit = d.limit; S.maxBots = d.max_bots;
  }catch(e){ $("#app").innerHTML = `<div class="card empty"><p>این برنامه فقط داخل تلگرام کار می‌کنه.<br><span class="muted">از ربات مادر دکمه‌ی «ساخت ربات» رو بزن.</span></p></div>`; return; }
  render();
}

function render(){
  $("#quota").textContent = `سهمیه‌ی امروز: ${S.quota} از ${S.limit}`;
  S.view === "list" ? renderList() : renderBot();
}

function renderList(){
  const list = S.bots.map(b => `
    <div class="card bot" data-id="${b.id}">
      <span class="dot ${b.active?"on":""}"></span>
      <div><b>${esc(b.name)}</b><span class="muted">${b.active ? "@"+esc(b.username) : "هنوز فعال نشده"}</span></div>
    </div>`).join("");
  $("#app").innerHTML = (list || `<div class="card empty"><p>هنوز رباتی نساختی.<br><span class="muted">یه جمله بنویس، ربات آماده می‌شه.</span></p></div>`)
    + (S.bots.length < S.maxBots ? `<button id="new">＋ ساخت ربات جدید</button>` : `<p class="muted" style="text-align:center">به سقف ${S.maxBots} ربات رسیدی</p>`);
  document.querySelectorAll(".bot").forEach(el => el.onclick = () => { S.cur = S.bots.find(b=>b.id===el.dataset.id); S.view="bot"; render(); });
  $("#new")?.addEventListener("click", () => { S.cur = null; S.view = "bot"; render(); });
}

const CH_RE = /^https:\/\/t\.me\/([A-Za-z][A-Za-z0-9_]{4,31})\/?$/;
const NAME_RE = /^@?([A-Za-z][A-Za-z0-9_]{4,31})$/;
const cp = o => JSON.parse(JSON.stringify(o));

const titleOf = (cfg, id) => { const n = cfg.nodes[id]; return n ? (n.title || (n.text||"").replace(/\s+/g," ").slice(0,24) || id) : "؟"; };
const kindOf = b => b.goto !== undefined ? "goto" : b.alert !== undefined ? "alert" : b.copy !== undefined ? "copy" : b.url !== undefined ? (CH_RE.test(b.url||"") ? "channel" : "url") : "text";
const btnInfo = (cfg, b) => {
  const k = kindOf(b);
  return k==="goto" ? "← "+esc(titleOf(cfg,b.goto)) : k==="channel" ? "📢 @"+esc(CH_RE.exec(b.url)[1])
    : k==="alert" ? "💬 پیام پاپ‌آپ" : k==="copy" ? "📋 کپی متن" : k==="text" ? "📝 متن ساده" : "🔗 "+esc((b.url||"").replace(/^https:\/\//,"").slice(0,22));
};

function nodeCard(cfg, id){
  const n = cfg.nodes[id], tags = [];
  if(id===cfg.start) tags.push("شروع");
  if(id===cfg.fallback) tags.push("پیام ناشناس");
  if(n.fields) tags.push("فرم");
  else if(n.ask) tags.push("دریافت پیام");
  if(n.photo) tags.push("🖼 عکس");
  const kbType = n.keyboard_type === "reply" ? "ریپلای" : "اینلاین";
  const kb = n.buttons.map((row,r) => `<div class="krow">${row.map((b,c) =>
      `<button class="kb" data-sa="btn" data-n="${id}" data-r="${r}" data-c="${c}">${esc(b.text)}<small>${btnInfo(cfg,b)}</small></button>`).join("")}
      ${row.length<3 ? `<button class="kb add" data-sa="newbtn" data-n="${id}" data-r="${r}">＋</button>` : ""}</div>`).join("");
  return `
    <div class="card nd" data-node="${id}">
      <div class="nh" data-sa="toggle" data-n="${id}" style="cursor:pointer">
        <b>${esc(titleOf(cfg,id))}</b>
        ${tags.map(t=>`<span class="tag">${t}</span>`).join("")}
        <span class="tag" style="margin-right:auto">${kbType}</span>
        <span class="pen" style="margin-right:8px">▼</span>
      </div>
      <div class="bubble" data-sa="node" data-n="${id}">${esc(n.text)}<span class="pen">✏️</span></div>
      <div class="node-body" style="display:none">
        ${n.fields ? `<div class="muted" style="margin-top:6px">سؤال‌ها: ${n.fields.map(esc).join(" ← ")}</div>` : ""}
        ${kb}
        ${n.buttons.length<6 ? `<button class="kb add wide" data-sa="newrow" data-n="${id}">＋ دکمه‌ی جدید</button>` : ""}
      </div>
    </div>`;
}

function renderBot(){
  const b = S.cur;
  const prompt = `
    <div class="card">
      <h2>${b ? "چی رو تغییر بدم؟" : "چه رباتی می‌خوای؟"}</h2>
      <textarea id="prompt" maxlength="1200" placeholder="${b ? "مثلاً: یه دکمه‌ی پشتیبانی اضافه کن" : "مثلاً: ربات فروشگاه لوازم جانبی موبایل با منوی محصولات و دکمه‌ی سفارش"}"></textarea>
      <div style="height:10px"></div>
      <button id="gen">${b ? "ارتقا بده" : "بساز"}</button>
    </div>
    <div id="live"></div>`;
  let body = "";
  if(b){
    body += `<div class="think${b.thinking?" show":""}" id="think"><span class="ic">✨</span><span class="tt">${S.fresh ? "" : esc(b.thinking||"")}</span></div>`;
    body += `<div class="hd" style="padding:2px 2px 8px"><h2 style="font-size:14px">پیش‌نمایش ربات</h2><button class="sm ghost" data-sa="bot">⚙️ تنظیمات ربات</button></div>
             <p class="muted" style="margin:0 2px 10px">روی هر متن یا دکمه بزن تا همون‌جا ویرایشش کنی.</p>`;
    body += Object.keys(b.config.nodes).map(id => nodeCard(b.config, id)).join("");
    body += `<button class="ghost" data-sa="addnode" style="margin-bottom:12px">＋ بخش جدید</button>`;
    if(b.versions) body += `<button class="ghost" id="undo" style="margin-bottom:12px">↩ برگشت به نسخه‌ی قبلی</button>`;
    body += b.active
      ? `<div class="card"><h2>🟢 فعاله: @${esc(b.username)}</h2><p class="muted" style="margin-bottom:10px">تغییرات بلافاصله روی ربات اعمال می‌شن. برای دریافت پیام‌های کاربرها، یک بار ربات خودت رو استارت کن.</p><button class="ghost" id="off">غیرفعال کردن</button></div>`
      : `<div class="card"><h2>فعال‌سازی</h2><p class="muted" style="margin-bottom:10px">ربات رو از @BotFather بساز و توکنش رو اینجا بذار.</p><input id="token" placeholder="123456:ABC..." autocomplete="off"><div style="height:10px"></div><button id="act">فعال کن</button></div>`;
    body += `<button class="danger" id="del">حذف ربات</button>`;
  }
  $("#app").innerHTML = `<button class="back" id="back">← بازگشت</button>${prompt}${body}`;
  $("#back").onclick = () => { S.view="list"; S.cur=null; closeSheet(); load(); };
  $("#gen").onclick = generate;
  $("#undo")?.addEventListener("click", undo);
  $("#act")?.addEventListener("click", activate);
  $("#off")?.addEventListener("click", () => act("deactivate", "ربات غیرفعال شد"));
  $("#del")?.addEventListener("click", remove);
  if(S.fresh && b?.thinking){ typeText($("#think .tt"), b.thinking); $("#think").scrollIntoView({behavior:"smooth",block:"nearest"}); }
  S.fresh = false;
}

/* ───────── تایپ تدریجی توضیح هوش مصنوعی ───────── */
function typeText(el, text){
  const id = ++typeText.id;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent = text; return; }
  let i = 0; el.textContent = "";
  (function step(){
    if(id !== typeText.id || !el.isConnected) return;
    i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i);
    if(i < text.length) setTimeout(step, 16);
  })();
}
typeText.id = 0;

const THINK_MESSAGES = [
  "در حال تحلیل درخواست…",
  "طراحی منطق ربات…",
  "سازماندهی مسیرها و دکمه‌ها…",
  "تولید متن‌های بهینه…",

];
function startLive(){
  const box = $("#live"); if(!box) return;
  $("#think")?.classList.remove("show");
  box.innerHTML = `<div class="live">
    <div class="live-content">
      <div class="live-indicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/></svg></div>
      <div class="live-text"><p id="live-msg">${THINK_MESSAGES[0]}</p></div>
      <div class="live-dots"><span></span><span></span><span></span></div>
    </div>
  </div>`;
  box.scrollIntoView({behavior:"smooth",block:"center"});
  let i = 0; clearInterval(startLive.t);
  const msgEl = $("#live-msg");
  startLive.t = setInterval(() => {
    if(!msgEl) return clearInterval(startLive.t);
    i = (i + 1) % THINK_MESSAGES.length;
    msgEl.style.opacity = "0";
    setTimeout(() => { msgEl.textContent = THINK_MESSAGES[i]; msgEl.style.opacity = "1"; }, 120);
  }, 2600);
  msgEl.style.transition = "opacity .12s ease";
}
function stopLive(){ clearInterval(startLive.t); const box = $("#live"); if(box) box.innerHTML = ""; }

function readNode(){

  D.keyboard_type = g("#f-kbtype") ?? D.keyboard_type;
  D.mode = g("#f-mode") ?? D.mode;
  if(document.querySelector(".fld")) D.fields = [...document.querySelectorAll(".fld")].map(i => i.value);
  if($("#f-done")){ D.done = g("#f-done"); D.next = g("#f-next"); }

function saveNode(){
  const id = S.sheet.id;
  if(!D.text.trim()) return toast("متن پیام نباید خالی باشه");
  if(D.mode==="form" && !D.fields.some(f=>f.trim())) return toast("حداقل یک سؤال برای فرم بنویس");
  busy($('[data-sh="save"]'), () => commit(cfg => {
    const n = cfg.nodes[id];
    for(const k of ["title","photo","ask","fields","done","next","keyboard_type"]) delete n[k];
    n.text = D.text.trim();
    if(D.title.trim()) n.title = D.title.trim();
    if(D.photo.trim()) n.photo = D.photo.trim();
    n.keyboard_type = D.keyboard_type;
    if(D.mode==="ask") n.ask = true;
    if(D.mode==="form") n.fields = D.fields.map(f=>f.trim()).filter(Boolean);
    if(D.mode!=="show"){ if(D.done.trim()) n.done = D.done.trim(); if(D.next) n.next = D.next; }
    if(D.start) cfg.start = id;
    if(D.fb) cfg.fallback = id;
  }));

function delNode(){
  const id = S.sheet.id;
  const go = ok => ok && busy($('[data-sh="del"]'), () => commit(cfg => {
    delete cfg.nodes[id];
    for(const n of Object.values(cfg.nodes)){
      n.buttons = n.buttons.map(r => r.filter(b => b.goto !== id)).filter(r => r.length);
      if(n.next === id) delete n.next;
    }
    for(const k of Object.keys(cfg.commands||{})) if(cfg.commands[k] === id) delete cfg.commands[k];
  }, "بخش حذف شد"));
  const q = "این بخش و دکمه‌هایی که بهش وصلن حذف بشن؟";
  tg?.showConfirm ? tg.showConfirm(q, go) : go(confirm(q));
}

  let k = ids.length + 1; while(cfg.nodes["page_"+k]) k++;

  busy($('[data-sa="addnode"]'), async () => {

      buttons:[[{text:"🏠 منوی اصلی", goto:c.start}]]}; }, "بخش اضافه شد");

  });
}

}
function saveBot(){
  const d = D, chs = d.channels.split(/[\s,،]+/).filter(Boolean);
  busy($('[data-sh="save"]'), () => commit(cfg => {
    cfg.name = d.name.trim() || "ربات من";
    if(chs.length) cfg.join = {channels:chs, text:d.jtext.trim()}; else delete cfg.join;
    cfg.commands = {};
    d.cmds.forEach(([k,v]) => { k = k.trim().replace(/^\//,"").toLowerCase(); if(k) cfg.commands[k] = v; });
  }));
}

/* ── هماهنگی شیت‌ها ── */
function renderSheet(){
  showSheet({node:nodeSheet, btn:btnSheet, bot:botSheet}[S.sheet.kind]());
}
function readSheet(){ ({node:readNode, btn:readBtn, bot:readBot}[S.sheet.kind])(); }

function shAction(a, ds){
  if(!S.sheet) return;
  const prev = D.kind;
  readSheet();
  if(a==="save") return {node:saveNode, btn:saveBtn, bot:saveBot}[S.sheet.kind]();
  if(a==="del") return S.sheet.kind==="node" ? delNode() : delBtn();
  if(a==="bkind"){
    const k = D.kind, wasText = prev==="channel"||prev==="url";
    if(k==="channel"){ const m = CH_RE.exec(D.val) || NAME_RE.exec(D.val); D.val = m ? "@"+m[1] : ""; }
    else if(k==="url"){ D.val = NAME_RE.test(D.val) ? "https://t.me/"+D.val.replace("@","") : (wasText ? D.val : ""); }
    else if(k!=="goto" && prev!==k) D.val = "";
  }
  else if(a==="addfld") D.fields.push("");
  else if(a==="delfld") D.fields.splice(+ds.i, 1), D.fields.length || D.fields.push("");
  else if(a==="addcmd") D.cmds.push(["help", S.cur.config.start]);
  else if(a==="delcmd") D.cmds.splice(+ds.i, 1);
  else if(a==="kbtype") {
    const cfg = S.cur.config, node = cfg.nodes[S.sheet.id];
    const newType = D.keyboard_type;
    node.buttons = node.buttons.map(row => row.map(b => {
      if(newType === "reply") {
        return {text: b.text}; // simple text button for reply keyboard
      } else {
        // inline: convert to goto start if it was just text
        return b.goto ? b : {text: b.text, goto: cfg.start};
      }
    }));
  }
  renderSheet();
}

document.addEventListener("click", e => {
  const x = e.target.closest("[data-x],[data-sa],[data-sh]"); if(!x || x.tagName==="SELECT") return;
  const ds = x.dataset;
  if(ds.x) return closeSheet();
  if(ds.sh) return shAction(ds.sh, ds);
  const r = ds.r !== undefined ? +ds.r : null;
  if(ds.sa==="node") openNode(ds.n);
  else if(ds.sa==="btn") openBtn(ds.n, r, +ds.c);
  else if(ds.sa==="newbtn") openBtn(ds.n, r, null);
  else if(ds.sa==="newrow") openBtn(ds.n, null, null);
  else if(ds.sa==="bot") openBot();
  else if(ds.sa==="addnode") addNode();
  else if(ds.sa==="toggle") {
    const card = x.closest(".card.nd");
    const body = card.querySelector(".node-body");
    const icon = x.querySelector(".pen");
    if(body.style.display === "none") {
      body.style.display = "block";
      icon.textContent = "▲";
    } else {
      body.style.display = "none";
      icon.textContent = "▼";
    }
  }
});
document.addEventListener("change", e => {
  const a = e.target.dataset.sh;
  if(a==="mode" || a==="bkind" || a==="kbtype") shAction(a, e.target.dataset);
});

async function busy(btn, fn){
  if(S.busy) return; S.busy = true;
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = old + '<span class="spin"></span>';
  try{ await fn(); }catch(e){ toast(e.message); }
  S.busy = false; if(btn.isConnected){ btn.disabled = false; btn.innerHTML = old; }
}

function generate(){
  const btn = $("#gen"), ta = $("#prompt"), p = ta.value.trim();
  if(p.length < 5) return toast("توضیح بیشتری بنویس");
  busy(btn, async () => {
    ta.readOnly = true; startLive();
    try{
      const d = await api("/api/generate","POST",{ prompt:p, bot_id:S.cur?.id });
      const wasActive = S.cur?.active;
      S.cur = d.bot; S.quota = d.quota; S.fresh = true; stopLive(); render();
      toast(wasActive ? "ربات ارتقا پیدا کرد ✅" : "ربات ساخته شد ✅");
      tg?.HapticFeedback?.notificationOccurred("success");
    } finally { stopLive(); ta.readOnly = false; }
  });
}
function undo(){ busy($("#undo"), async () => { const d = await api(`/api/bots/${S.cur.id}/undo`,"POST"); S.cur = d.bot; render(); toast("برگشت داده شد"); }); }
function activate(){
  const t = $("#token").value.trim(); if(!t) return toast("توکن رو وارد کن");
  busy($("#act"), async () => { const d = await api(`/api/bots/${S.cur.id}/activate`,"POST",{token:t}); S.cur = d.bot; render(); toast("ربات فعال شد 🎉"); });
}
function act(action, msg){ busy($("#off"), async () => { const d = await api(`/api/bots/${S.cur.id}/${action}`,"POST"); S.cur = d.bot; render(); toast(msg); }); }
function remove(){
  const go = async ok => { if(!ok) return; await api(`/api/bots/${S.cur.id}`,"DELETE"); S.view="list"; S.cur=null; load(); toast("حذف شد"); };
  tg?.showConfirm ? tg.showConfirm("این ربات برای همیشه حذف بشه؟", go) : go(confirm("حذف بشه؟"));
}

load();
initBotbar();
</script>
</body>
</html>
