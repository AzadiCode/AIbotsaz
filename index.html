<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Super BotMaker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#0f1420); --bg2:var(--tg-theme-secondary-bg-color,#171e2e);
  --card:var(--tg-theme-bg-color,#ffffff); --tx:var(--tg-theme-text-color,#101828);
  --hint:var(--tg-theme-hint-color,#8a94a6); --ac:var(--tg-theme-button-color,#5b6cff);
  --act:var(--tg-theme-button-text-color,#fff); --line:rgba(127,140,160,.16);
  --gold:#f5b942; --green:#22b07d; --red:#e5484d;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{font-family:"Vazirmatn",Tahoma,system-ui,sans-serif;background:var(--bg2);color:var(--tx);
  font-size:15px;line-height:1.75;padding:0 14px calc(var(--dockh,86px) + 16px);max-width:640px;margin:0 auto}
/* robotic numbers: always english + bold robotic */
.num,.en{font-family:"Orbitron","Vazirmatn",monospace;font-weight:700;letter-spacing:.02em;
  direction:ltr;unicode-bidi:embed;font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:14px 2px 10px;background:linear-gradient(var(--bg2) 78%,transparent)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--ac),#9b6bff 60%,#34c3ff);box-shadow:0 6px 18px rgba(91,108,255,.35)}
.logo svg{width:22px;height:22px}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.3}
.brand small{display:block;font-size:11.5px;color:var(--hint);font-weight:500}
.tok{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:6px 12px 6px 8px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer}
.tok .coin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#5a3c00;
  background:radial-gradient(circle at 35% 30%,#ffe9b0,var(--gold) 65%,#d9930d);font-weight:800;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;
  box-shadow:0 2px 12px rgba(15,25,45,.05)}
.card h2{font-size:14.5px;font-weight:800;margin-bottom:6px}
.muted{color:var(--hint);font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--ac);color:var(--act);width:100%;font-weight:700}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.soft{background:rgba(91,108,255,.1);color:var(--ac)}
button.gold{background:linear-gradient(135deg,#f5b942,#f08a1d);color:#3a2400}
button.danger{background:transparent;color:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
textarea,input,select{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:1px solid transparent;
  border-radius:12px;padding:11px 12px;outline:none;resize:none}
textarea:focus,input:focus,select:focus{border-color:var(--ac)}
textarea{min-height:104px}
input.ltr{direction:ltr;text-align:left}
.hero{background:linear-gradient(135deg,#1c2440,#2a2f6b 55%,#0e3a5d);color:#fff;border:0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.22) 1px,transparent 0);background-size:16px 16px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%)}
.hero>*{position:relative}
.hero h2{font-size:17px}
.hero p{font-size:13px;opacity:.85;margin:4px 0 12px}
.hero .cta{display:flex;gap:8px}
.hero .cta button{padding:10px}
.cost{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:rgba(245,185,66,.16);
  border:1px solid rgba(245,185,66,.45);color:var(--gold);border-radius:99px;padding:2px 10px;margin-top:8px}
.bot{display:flex;align-items:center;gap:11px;cursor:pointer}
.bot .ava{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;
  background:linear-gradient(135deg,var(--ac),#34c3ff)}
.bot b{display:block;font-size:14.5px}.bot small{color:var(--hint);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hint);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.back{background:none;color:var(--ac);width:auto;padding:8px 2px;margin-bottom:2px;font-weight:700}
#toast{position:fixed;bottom:calc(var(--dockh,86px) + 12px);left:50%;transform:translateX(-50%);background:#141a2b;color:#fff;
  padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:99}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes s{to{transform:rotate(360deg)}}
.think{display:flex;gap:9px;background:rgba(91,108,255,.07);border:1px solid rgba(91,108,255,.22);border-radius:12px;
  padding:9px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.8}
.think .bar{width:3px;border-radius:3px;background:linear-gradient(var(--ac),#34c3ff);flex:none}
/* node cards */
.nd{padding:0;overflow:hidden}
.nd .nh{display:block;padding:13px 14px;cursor:pointer;user-select:none}
.nd .nr{display:flex;align-items:center;gap:10px}
.nd .nt{flex:1;min-width:0}.nd .nt b{display:block;font-size:14px}
.nd .ns{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nd.open .ns{opacity:0;max-height:0}
.nd .nm{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11px;background:var(--bg2);border-radius:7px;padding:1px 9px;color:var(--hint)}
.tag.cnt{background:rgba(91,108,255,.12);color:var(--ac)}
.chev{width:18px;height:18px;flex:none;color:var(--hint);transition:transform .3s}
.nd.open .chev{transform:rotate(180deg);color:var(--ac)}
.nbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
.nd.open .nbody{grid-template-rows:1fr}
.nbody>div{overflow:hidden}.nbi{padding:12px 14px 14px;opacity:0;transition:opacity .25s}
.nd.open .nbi{opacity:1}
.bubble{position:relative;background:var(--bg2);border-radius:13px;padding:10px 12px 10px 34px;white-space:pre-wrap;cursor:pointer;border:1px solid transparent}
.bubble .pen{position:absolute;left:10px;top:9px;font-size:13px;opacity:.5}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(34,176,125,.12);color:var(--green);
  border-radius:8px;padding:2px 9px;margin-top:8px}
.krow{display:flex;gap:6px;margin-top:6px}
button.kb{flex:1;min-width:0;background:var(--bg2);color:var(--tx);padding:8px 6px;font-size:13.5px;border-radius:10px;border:1px solid var(--line);font-weight:500}
button.kb small{display:block;color:var(--hint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.kb.add{flex:0 0 40px;background:transparent;color:var(--ac);border:1px dashed var(--ac)}
button.kb.add.wide{display:block;width:100%;margin-top:6px;font-size:13px}
.tray{background:rgba(127,140,160,.14);border-radius:12px;padding:6px;margin-top:10px}
/* build animation */
.build{background:var(--card);border:1px solid rgba(91,108,255,.25);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;position:relative;overflow:hidden}
.build .bh{display:flex;align-items:center;gap:10px}
.core{width:34px;height:34px;flex:none}
.build .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(127,127,127,.15);overflow:hidden}
.build .prog::after{content:"";position:absolute;left:0;top:0;bottom:0;width:38%;background:linear-gradient(90deg,transparent,var(--ac),#9b6bff,transparent);animation:slide 1.6s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(280%)}}
.steps{display:flex;margin-top:10px}
.st{flex:1;text-align:center;font-size:10.5px;color:var(--hint)}
.st i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 4px;background:var(--card);border:2px solid rgba(127,127,127,.4)}
.st.done i{background:var(--ac);border-color:var(--ac)}.st.cur{color:var(--tx)}.st.cur i{border-color:var(--ac)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;display:none}.sheet.show{display:block}
.sb{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sp{position:absolute;bottom:0;left:0;right:0;max-height:92vh;overflow-y:auto;background:var(--card);color:var(--tx);
  border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
button.sm{width:auto;padding:6px 12px;font-size:12.5px;border-radius:9px}
button.x{background:transparent;color:var(--red);padding:5px 9px}
.lbl{display:block;font-size:12.5px;color:var(--hint);margin:12px 0 4px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:12px}
input[type=checkbox]{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:transparent;color:var(--hint);border:1px solid var(--line);font-size:12px;font-weight:600}
.seg button.on{border-color:var(--ac);color:var(--ac);background:rgba(91,108,255,.07)}
.rl{background:var(--bg2);border-radius:11px;padding:8px;margin-bottom:8px}
.cmd{display:flex;gap:6px;margin-bottom:6px}.cmd input,.cmd select{flex:1;min-width:0;padding:8px}
.bar{display:flex;gap:8px;margin-top:16px}.bar button{flex:1}
.mediaPrev{border-radius:12px;overflow:hidden;margin-top:8px;background:var(--bg2);border:1px solid var(--line)}
.mediaPrev img,.mediaPrev video{width:100%;max-height:220px;object-fit:cover;display:block}
.upbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--ac);color:var(--ac);
  background:transparent;border-radius:12px;padding:10px;margin-top:8px;font-weight:700}
/* dock */
body{--dockh:calc(82px + env(safe-area-inset-bottom))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40}
.dpanel{display:flex;justify-content:center;gap:4px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);max-width:640px;margin:0 auto;
  border-radius:20px 20px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.08)}
.dn{flex:1;background:transparent;color:var(--hint);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px;border-radius:12px;font-weight:600}
.dn svg{width:22px;height:22px}.dn.on{color:var(--ac);background:rgba(91,108,255,.1)}
.dn.fab{color:var(--act)}.dn.fab span.ic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--ac),#9b6bff);margin-top:-26px;box-shadow:0 8px 20px rgba(91,108,255,.45)}
/* tokens */
.tbal{background:linear-gradient(135deg,#232c4e,#3b2f6b 60%,#123);color:#fff;border:0;position:relative;overflow:hidden;text-align:center;padding:22px 16px}
.tbal .big{font-size:42px;line-height:1.2}
.tbal .lvl{display:inline-block;font-size:11.5px;background:rgba(255,255,255,.14);border-radius:99px;padding:2px 12px;margin-top:6px}
.plan{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;background:var(--card)}
.plan b{display:block;font-size:14px}.plan .num{color:var(--gold)}
.kv div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.kv div:first-child{border-top:0}.kv span{color:var(--hint)}
details.adv{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:0 12px}
details.adv>summary{cursor:pointer;padding:10px 0;font-size:13px;display:flex;justify-content:space-between}
details.adv>summary::-webkit-details-marker{display:none}
.empty{text-align:center;padding:26px 8px}
.pvhd{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.rise{animation:rise .45s ease backwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="5" y="9" width="14" height="10" rx="3"/><path d="M12 9V5.5"/><circle cx="12" cy="4" r="1" fill="currentColor"/><circle cx="9.5" cy="13.5" r="1" fill="currentColor"/><circle cx="14.5" cy="13.5" r="1" fill="currentColor"/></svg></span>
    <div><b>Super BotMaker</b><small>استودیو ربات هوشمند</small></div>
  </div>
  <div class="tok" id="tokPill"><span class="coin">T</span><span class="num" id="tokNum">0</span></div>
</div>
<div id="app"></div>
<div id="sheet" class="sheet"></div>
<div id="toast"></div>
<nav class="dock"><div class="dpanel">
  <button class="dn" data-d="bots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="8" width="16" height="11" rx="3.5"/><circle cx="9" cy="13.5" r="1.1" fill="currentColor"/><circle cx="15" cy="13.5" r="1.1" fill="currentColor"/></svg><span>ربات‌ها</span></button>
  <button class="dn" data-d="tokens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10h4a1.8 1.8 0 0 1 0 3.6h-3a1.8 1.8 0 0 0 0 3.6h4.5"/></svg><span>توکن</span></button>
  <button class="dn fab" data-d="new"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>ساخت</span></button>
  <button class="dn" data-d="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4zM18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"/></svg><span>ایده</span></button>
  <button class="dn" data-d="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg><span>پروفایل</span></button>
</div></nav>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const INIT = tg?.initData || "";
let S = {view:"list", bots:[], quota:0, limit:0, maxBots:5, tokens:0, costs:{build:12,upgrade:8,daily:10,referral:25},
  referrals:0, refLink:"", refCode:"", daily:true, level:"Starter", joined:"", cur:null, open:new Set(),
  busy:false, fresh:false, shop:[], attach:null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cp = o => JSON.parse(JSON.stringify(o));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2800); }
async function api(path, method="GET", body){
  const r = await fetch(path, {method, headers:{"Content-Type":"application/json","X-Init-Data":INIT}, body: body?JSON.stringify(body):undefined});
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const e = new Error(d.error || "server error"); e.code=d.error; e.data=d; throw e; }
  return d;
}
async function uploadFile(file){
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch("/api/upload", {method:"POST", headers:{"X-Init-Data":INIT}, body:fd});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "upload failed");
  return d;
}
async function load(){
  try{
    const d = await api("/api/me");
    Object.assign(S, {bots:d.bots, quota:d.quota, limit:d.limit, maxBots:d.max_bots, tokens:d.tokens,
      costs:d.costs, referrals:d.referrals, refLink:d.referral_link, refCode:d.referral_code,
      daily:d.daily_claimable, level:d.level, joined:d.joined});
    try{ const s = await api("/api/tokens/shop"); S.shop = s.plans; }catch(_){}
  }catch(e){ $("#app").innerHTML = `<div class="card empty"><p>فقط داخل تلگرام باز می‌شود.<br><span class="muted">از ربات مادر وارد شو.</span></p></div>`; return; }
  render();
}
function render(){
  $("#tokNum").textContent = S.tokens;
  document.querySelectorAll(".dn").forEach(el=>{
    const v = el.dataset.d;
    el.classList.toggle("on", (v==="bots"&&(S.view==="list"||S.view==="bot")) || (v==="tokens"&&S.view==="tokens") || (v==="profile"&&S.view==="profile") || (v==="guide"&&S.view==="guide"));
  });
  ({list:renderList, bot:renderBot, tokens:renderTokens, profile:renderProfile, guide:renderGuide}[S.view]||renderList)();
}
/* ---------- list ---------- */
function renderList(){
  const cards = S.bots.map((b,i)=>`
    <div class="card bot rise" style="--i:${i}" data-id="${b.id}">
      <span class="ava">${esc((b.name||"R").trim().charAt(0))}</span>
      <div style="flex:1"><b>${esc(b.name)}</b><small class="en">${b.active ? "@"+esc(b.username||"") : "offline"}</small></div>
      <span class="dot ${b.active?"on":""}"></span>
    </div>`).join("");
  $("#app").innerHTML = `
    <div class="card hero"><h2>هر رباتی بخواهی، توصیف کن</h2>
      <p>هوش مصنوعی می‌سازد. متن، دکمه، فرم، عکس و ویدیو. هزینه هر ساخت <span class="num">${S.costs.build}</span> توکن.</p>
      <div class="cta"><button id="new2">ساخت ربات جدید</button><button class="ghost" id="goTok" style="color:#fff;border-color:rgba(255,255,255,.35)">توکن <span class="num">${S.tokens}</span></button></div>
    </div>
    ${cards || `<div class="card empty"><p>هنوز رباتی نداری.<br><span class="muted">اولین رباتت را با یک جمله بساز.</span></p></div>`}`;
  document.querySelectorAll(".bot").forEach(el=>el.onclick=()=>{ S.cur=S.bots.find(b=>b.id===el.dataset.id); S.view="bot"; S.open=new Set(); S.attach=null; render(); });
  $("#new2").onclick = ()=>{ S.cur=null; S.view="bot"; S.open=new Set(); S.attach=null; render(); };
  $("#goTok").onclick = ()=>{ S.view="tokens"; render(); };
  $("#tokPill").onclick = ()=>{ S.view="tokens"; render(); };
}
/* ---------- bot detail ---------- */
const CH_RE = /^https:\/\/t\.me\/([A-Za-z][A-Za-z0-9_]{4,31})\/?$/;
const titleOf = (cfg,id)=>{ const n=cfg.nodes[id]; return n ? (n.title||(n.text||"").replace(/\s+/g," ").slice(0,24)||id) : "?"; };
const kindOf = b => b.goto!==undefined?"goto":b.alert!==undefined?"alert":b.copy!==undefined?"copy":CH_RE.test(b.url||"")?"channel":"url";
const fa0 = n => String(n ?? 0);
function nodeCard(cfg,id,i=0){
  const n=cfg.nodes[id], tags=[], isRk=n.kb==="reply";
  if(id===cfg.start)tags.push("start"); if(id===cfg.fallback)tags.push("fallback");
  if(n.fields)tags.push("form"); else if(n.ask)tags.push("ask");
  if(isRk)tags.push("reply-kb"); if(n.media)tags.push("media:"+n.media.kind); if(n.do?.length||n.route?.length||n.alt?.length)tags.push("logic");
  const open=S.open.has(id), nb=n.buttons.reduce((a,r)=>a+r.length,0);
  const prev=(n.text||"").replace(/\s+/g," ").slice(0,70);

function startLive(){

    <div class="steps">${STEPS.map(t=>`<div class="st"><i></i>${t}</div>`).join("")}</div><div class="prog"></div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"center"});
  let i=0; clearInterval(startLive.t);
  const msgs=["درخواست خوانده شد...","مسیر کاربران طراحی شد...","بخش‌ها چیده شد...","بازبینی نهایی..."];

  set(0); startLive.t=setInterval(()=>{ i=Math.min(i+1,3); const p=$("#ph"); if(!p) return clearInterval(startLive.t); p.textContent=msgs[i]; set(i); },2200);

function generate(){
  const btn=$("#gen"), ta=$("#prompt"), p=ta.value.trim();

}

  D.do=dos.map((el,i)=>({op:el.value,var:cleanVar(document.querySelectorAll(".a-var")[i].value),value:document.querySelectorAll(".a-val")[i].value}));
  const cvars=[...document.querySelectorAll(".c-var")];
  D.route=cvars.map((el,i)=>({c:{var:cleanVar(el.value),op:document.querySelectorAll(".c-op")[i].value,value:document.querySelectorAll(".c-val")[i].value},goto:document.querySelectorAll(".r-goto")[i].value}));
}
function saveNode(){
  const id=S.sheet.id;
  if(!D.text.trim()) return toast("متن خالی است");
  busy($('[data-sh="save"]'),()=>commit(cfg=>{
    const n=cfg.nodes[id];
    for(const k of ["title","ask","fields","save","types","silent","done","next","kb","do","route","alt","media"]) delete n[k];
    if(D.kb==="reply"&&D.mode==="show")n.kb="reply";
    n.text=D.text.trim(); if(D.title.trim())n.title=D.title.trim();
    if(D.media)n.media=D.media;
    if(D.mode==="ask")n.ask=true;
    if(D.mode==="form"){ const fl=D.fields.filter(f=>f.q.trim()); n.fields=fl.map(f=>f.q.trim()); if(fl.some(f=>f.v))n.save=fl.map(f=>f.v); if(fl.some(f=>f.t!=="text"))n.types=fl.map(f=>f.t); if(D.silent)n.silent=true; }
    if(D.mode!=="show"){ if(D.done.trim())n.done=D.done.trim(); if(D.next)n.next=D.next; }
    if(D.do.length)n.do=D.do.filter(a=>a.op==="notify"?a.value.trim():a.var).map(a=>a.op==="clear"?{op:"clear",var:a.var}:{op:a.op,var:a.var,value:a.value||""});
    if(D.route.length)n.route=D.route.filter(r=>r.c.var).map(r=>({when:r.c,goto:r.goto}));
    if(D.start)cfg.start=id; if(D.fb)cfg.fallback=id;
  }));
}
const KINDS=[["goto","بخش"],["channel","کانال"],["url","لینک"],["alert","پاپ‌آپ"],["copy","کپی"]];
function openBtn(nid,r,c){
  const cfg=S.cur.config;
  S.sheet={kind:"btn",n:nid,r,c};
  if(c===null) D={text:"دکمه",kind:"goto",goto:cfg.start,val:""};
  else{ const b=cfg.nodes[nid].buttons[r][c],k=kindOf(b);
    D={text:b.text,kind:k,goto:b.goto||cfg.start,val:k==="channel"?"@"+CH_RE.exec(b.url)[1]:b.url||b.alert||b.copy||""}; }
  renderSheet();
}
function btnSheet(){
  const cfg=S.cur.config,d=D,isNew=S.sheet.c===null;
  const val={goto:`<span class="lbl">بخش مقصد</span><select id="b-goto">${Object.keys(cfg.nodes).map(k=>`<option value="${k}"${k===d.goto?" selected":""}>${esc(k)}</option>`).join("")}</select>`,
    channel:`<span class="lbl">آیدی کانال</span><input id="b-val" class="ltr" value="${esc(d.val)}" placeholder="@channel">`,
    url:`<span class="lbl">لینک</span><input id="b-val" class="ltr" value="${esc(d.val)}" placeholder="https://...">`,
    alert:`<span class="lbl">متن پاپ‌آپ</span><textarea id="b-val" maxlength="200">${esc(d.val)}</textarea>`,
    copy:`<span class="lbl">متن کپی</span><input id="b-val" value="${esc(d.val)}" maxlength="256">`}[d.kind];
  return head(isNew?"دکمه جدید":"ویرایش دکمه")+`<span class="lbl">متن دکمه</span><input id="b-text" value="${esc(d.text)}" maxlength="40">
    <span class="lbl">عمل</span><select id="b-kind" data-sh="bkind">${KINDS.map(([v,l])=>`<option value="${v}"${v===d.kind?" selected":""}>${l}</option>`).join("")}</select>${val}
    <div class="bar"><button data-sh="save">ذخیره</button>${isNew?"":`<button class="ghost danger" data-sh="del">حذف</button>`}</div>`;
}
function saveBtn(){
  const {n:nid,r,c}=S.sheet,d=D;
  if(!$("#b-text").value.trim()) return toast("متن دکمه لازم است");
  const btn={text:$("#b-text").value.trim()};
  d.kind=$("#b-kind").value;
  if(d.kind==="goto")btn.goto=$("#b-goto").value;
  else if(d.kind==="alert")btn.alert=$("#b-val").value.trim();
  else if(d.kind==="copy")btn.copy=$("#b-val").value.trim();
  else btn.url=$("#b-val").value.trim();
  busy($('[data-sh="save"]'),()=>commit(cfg=>{ const rows=cfg.nodes[nid].buttons;
    if(c!==null)rows[r][c]=btn; else if(r!==null&&rows[r])rows[r].push(btn); else rows.push([btn]); }));
}
function openBot(){
  const cfg=S.cur.config;
  S.sheet={kind:"bot"};
  D={name:cfg.name,channels:(cfg.join?.channels||[]).map(c=>"@"+c).join(" "),jtext:cfg.join?.text||"",cmds:Object.entries(cfg.commands||{}),vars:Object.entries(cfg.vars||{})};
  renderSheet();
}
function botSheet(){
  const cfg=S.cur.config,d=D;
  return head("تنظیمات ربات")+`<span class="lbl">نام</span><input id="s-name" value="${esc(d.name)}" maxlength="50">
    <span class="lbl">عضویت اجباری (تا 3 کانال)</span><input id="s-chs" class="ltr" value="${esc(d.channels)}" placeholder="@ch1 @ch2">
    <span class="lbl">پیام عضویت</span><textarea id="s-jtext" maxlength="500">${esc(d.jtext)}</textarea>
    <div class="lbl">دستورها</div>${d.cmds.map(([k,v],i)=>`<div class="cmd"><input class="cmdn ltr" value="${esc(k)}"><select class="cmdv">${Object.keys(cfg.nodes).map(n=>`<option value="${n}"${n===v?" selected":""}>${esc(n)}</option>`).join("")}</select><button class="sm x" data-sh="delcmd" data-i="${i}">x</button></div>`).join("")}<button class="sm ghost" data-sh="addcmd">+ دستور</button>
    <div class="lbl">متغیرها (per-user)</div>${d.vars.map(([k,v],i)=>`<div class="cmd"><input class="vn ltr" value="${esc(k)}"><input class="vd" value="${esc(v)}"><button class="sm x" data-sh="delvar" data-i="${i}">x</button></div>`).join("")}<button class="sm ghost" data-sh="addvar">+ متغیر</button>
    <div class="bar"><button data-sh="save">ذخیره</button></div>`;
}
function renderSheet(){ showSheet({node:nodeSheet,btn:btnSheet,bot:botSheet}[S.sheet.kind]());
  const nf=$("#nodeFile");
  nf && nf.addEventListener("change", async ()=>{
    const f=nf.files[0]; if(!f) return; toast("در حال آپلود...");
    try{ const m=await uploadFile(f); readNodeKeepMedia(); D.media={kind:m.kind,url:m.url}; renderSheet(); toast("مدیا ثبت شد"); }
    catch(e){ toast(e.message); }
  });
}
function readNodeKeepMedia(){ try{ readNode(); }catch(_){} }
function shAction(a,ds){
  if(!S.sheet) return;
  if(a==="save"){ if(S.sheet.kind==="node"){readNode();return saveNode();} if(S.sheet.kind==="btn")return saveBtn();
    const d=D; return busy($('[data-sh="save"]'),()=>commit(cfg=>{ cfg.name=$("#s-name").value.trim()||"Bot";
      const chs=$("#s-chs").value.split(/[\s,]+/).filter(Boolean);
      if(chs.length)cfg.join={channels:chs,text:$("#s-jtext").value.trim()}; else delete cfg.join;
      cfg.commands={}; document.querySelectorAll(".cmdn").forEach((n,i)=>{ const k=n.value.trim().replace(/^\//,"").toLowerCase(); if(k)cfg.commands[k]=document.querySelectorAll(".cmdv")[i].value; });
      const vars={}; document.querySelectorAll(".vn").forEach((n,i)=>{ const k=cleanVar(n.value); if(k)vars[k]=document.querySelectorAll(".vd")[i].value.trim(); });
      if(Object.keys(vars).length)cfg.vars=vars; else delete cfg.vars; })); }
  if(S.sheet.kind==="node")readNode();
  if(a==="del"){ if(S.sheet.kind==="node"){ const id=S.sheet.id; return busy($('[data-sh="del"]'),()=>commit(cfg=>{ delete cfg.nodes[id];
      for(const n of Object.values(cfg.nodes)){ n.buttons=n.buttons.map(r=>r.filter(b=>b.goto!==id)).filter(r=>r.length); if(n.next===id)delete n.next; }
    },"حذف شد")); } const {n:nid,r,c}=S.sheet; return busy($('[data-sh="del"]'),()=>commit(cfg=>{ const rows=cfg.nodes[nid].buttons; rows[r].splice(c,1); if(!rows[r].length)rows.splice(r,1); },"حذف شد")); }
  if(S.sheet.kind==="btn"&&a==="del"){ const {n:nid,r,c}=S.sheet; return busy($('[data-sh="del"]'),()=>commit(cfg=>{ const rows=cfg.nodes[nid].buttons; rows[r].splice(c,1); if(!rows[r].length)rows.splice(r,1); },"حذف شد")); }
  if(a==="bkind")D.kind=$("#b-kind").value;
  else if(a==="kbt")D.kb=ds.v;
  else if(a==="mode")D.mode=$("#f-mode").value;
  else if(a==="addfld")D.fields.push({q:"",v:"",t:"text"});
  else if(a==="delfld"){D.fields.splice(+ds.i,1);D.fields.length||D.fields.push({q:"",v:"",t:"text"});}
  else if(a==="addcmd")D.cmds.push(["help",S.cur.config.start]);
  else if(a==="delcmd")D.cmds.splice(+ds.i,1);
  else if(a==="addvar")D.vars.push(["",""]);
  else if(a==="delvar")D.vars.splice(+ds.i,1);
  else if(a==="addrl"){ D[ds.l].push(ds.l==="do"?{op:"set",var:"",value:""}:{c:blankCond(),goto:S.cur.config.start}); }
  else if(a==="delrl")D[ds.l].splice(+ds.i,1);
  else if(a==="rmmedia")D.media=null;
  renderSheet();
}
document.addEventListener("click",e=>{
  const x=e.target.closest("[data-x],[data-sa],[data-sh],[data-d]"); if(!x) return;
  if(x.dataset.x) return closeSheet();
  if(x.dataset.d){ const w=x.dataset.d;
    if(S.busy) return toast("صبر کن...");
    closeSheet();
    if(w==="new"){S.cur=null;S.view="bot";S.open=new Set();S.attach=null;render();}
    else if(w==="tokens"){S.view="tokens";render();}
    else if(w==="profile"){S.view="profile";render();}
    else if(w==="guide"){S.view="guide";render();}
    else {S.view="list";S.cur=null;load();}
    scrollTo({top:0,behavior:"smooth"}); return; }
  if(x.dataset.sh) return shAction(x.dataset.sh,x.dataset);
  const ds=x.dataset;
  if(ds.sa==="node"){ const id=ds.n; openNode(id); }
  else if(ds.sa==="btn")openBtn(ds.n,+ds.r,+ds.c);
  else if(ds.sa==="newbtn")openBtn(ds.n,+ds.r,null);
  else if(ds.sa==="newrow")openBtn(ds.n,null,null);
  else if(ds.sa==="bot")openBot();
  else if(ds.sa==="addnode"){ const cfg=S.cur.config; if(Object.keys(cfg.nodes).length>=40) return toast("سقف بخش");
    let k=Object.keys(cfg.nodes).length+1; while(cfg.nodes["page_"+k])k++; const id="page_"+k; S.open.add(id);
    busy(x,async()=>{ await commit(c=>{c.nodes[id]={title:"بخش جدید",text:"متن بخش",ask:false,buttons:[[{text:"منو",goto:c.start}]]};},"اضافه شد"); openNode(id); }); }
  else if(ds.sa==="toggle"){ const id=ds.n; const card=x.closest(".nd"); const o=card.classList.toggle("open"); o?S.open.add(id):S.open.delete(id); }
  else if(ds.sa==="toggleall"){ const ids=Object.keys(S.cur.config.nodes); const all=ids.every(i=>S.open.has(i)); S.open=all?new Set():new Set(ids); renderBot(); }
});
document.addEventListener("change",e=>{ const a=e.target.dataset?.sh; if(a==="mode"||a==="bkind")shAction(a,e.target.dataset); });
$("#tokPill").onclick=()=>{S.view="tokens";render();};
load();
</script>
</body>
</html>
