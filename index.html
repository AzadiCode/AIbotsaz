<script>
(function(){
  var t0 = Date.now(), done = false;
  function hide(){ if(done) return; done = true; var el = document.getElementById("splash"); if(!el) return; el.classList.add("out"); setTimeout(function(){ el.remove(); }, 800); }
  function go(){ setTimeout(hide, Math.max(0, 4200 - (Date.now() - t0))); }
  if(document.readyState === "complete") go(); else window.addEventListener("load", go);
  setTimeout(hide, 7000);
})();
</script>
