<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ابر ربات‌ساز</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#7a828a);
  --ac:var(--tg-theme-button-color,#2f7cf6);
  --act:var(--tg-theme-button-text-color,#fff);
  --red:#e5484d; --green:#2fa36b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;background:var(--bg2);color:var(--tx);
  font-size:15px;line-height:1.7;padding:0 14px calc(var(--dockh,84px) + 18px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px}
.top h1{font-size:18px;font-weight:700}
.chip{font-size:12px;background:var(--bg);color:var(--hint);padding:3px 11px;border-radius:99px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:8px}
.muted{color:var(--hint);font-size:13px}
button{font:inherit;border:0;border-radius:11px;padding:11px 16px;cursor:pointer;background:var(--ac);color:var(--act);width:100%}
button.ghost{background:var(--bg2);color:var(--tx)}
button.danger{background:transparent;color:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
textarea,input{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 12px;outline:none;resize:none}
textarea{min-height:110px}
input{direction:ltr;text-align:left}
.bot{display:flex;align-items:center;gap:10px;cursor:pointer}
.bot b{display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hint);flex:none}
.dot.on{background:var(--green)}
.back{background:none;color:var(--ac);width:auto;padding:8px 2px;margin-bottom:2px}
.node{border-top:1px solid var(--bg2);padding:10px 0}
.node:first-of-type{border-top:0}
.node .id{font-size:12px;color:var(--hint);direction:ltr;text-align:right}
.node .tx{white-space:pre-wrap;margin:2px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;background:var(--bg2);border-radius:8px;padding:3px 10px}
.empty{text-align:center;padding:26px 8px}
.empty p{margin-bottom:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;
  border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.think{display:flex;gap:8px;background:linear-gradient(135deg,rgba(47,124,246,.09),rgba(47,124,246,.03));
  border:1px solid rgba(47,124,246,.16);border-radius:11px;padding:8px 11px;margin:-2px 0 12px;
  font-size:12px;line-height:1.6;color:var(--tx);opacity:0;max-height:0;overflow:hidden;
  transition:opacity .35s ease,max-height .35s ease,margin .35s ease,padding .35s ease}
.think.show{opacity:1;max-height:700px;margin:0 0 12px}
.think .ic{flex:none;font-size:14px;line-height:1.5}
.think .tt{color:var(--hint)}

/* ── انیمیشن «در حال فکر کردن» ── */
.live{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px;
  border:1px solid rgba(47,124,246,.18);position:relative;overflow:hidden;animation:pop .3s ease}
.live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(47,124,246,.09) 50%,transparent 70%);
  transform:translateX(-100%);animation:sh 2s ease-in-out infinite}
.orb{width:36px;height:36px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from 0deg,var(--ac),#9b6bff,#34c3ff,var(--ac));animation:s 1.3s linear infinite}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.live .lt b{display:block;font-size:14px}
.live .lt b i{display:inline-block;font-style:normal;animation:bn 1.2s infinite}
.live .lt b i:nth-child(2){animation-delay:.15s}.live .lt b i:nth-child(3){animation-delay:.3s}
.live .ph{font-size:12.5px;color:var(--hint);transition:opacity .3s}
.live .ph.out{opacity:0}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.orb{animation-duration:3s}.live::after,.live .lt b i{animation:none}}

/* ── ویرایشگر ── */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hd h2{margin:0}
button.sm{width:auto;padding:5px 11px;font-size:12.5px;border-radius:9px}
button.x{background:transparent;color:var(--red);padding:5px 9px}
.lbl{display:block;font-size:12.5px;color:var(--hint);margin:12px 0 4px}
input.fa,textarea.fa{direction:rtl;text-align:right}
input[type=checkbox]{width:auto;flex:none;margin:0}
select{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 10px;outline:none;min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:12px}
.tag{font-size:11px;background:var(--bg2);border-radius:6px;padding:1px 8px;color:var(--hint)}
.bubble{position:relative;background:var(--bg2);border-radius:14px;padding:10px 12px 10px 34px;white-space:pre-wrap;cursor:pointer;
  border:1px solid transparent;transition:border-color .15s}
.bubble:active{border-color:var(--ac)}
.bubble .pen{position:absolute;left:10px;top:9px;font-size:13px;opacity:.55}
.krow{display:flex;gap:6px;margin-top:6px}
button.kb{flex:1;min-width:0;background:var(--bg2);color:var(--tx);padding:8px 6px;font-size:13.5px;border-radius:10px;
  border:1px solid rgba(127,127,127,.2);line-height:1.5}
button.kb:active{border-color:var(--ac)}
button.kb small{display:block;color:var(--hint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.kb.add{flex:0 0 40px;background:transparent;color:var(--ac);border:1px dashed var(--ac);font-size:15px}
button.kb.add.wide{display:block;width:100%;margin-top:6px;font-size:13px}
.cmd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cmd input{flex:1;min-width:0}.cmd .cmdn{flex:0 0 34%}
.bar{display:flex;gap:8px;margin-top:16px}
.bar button{flex:1}
button.danger-b{background:transparent;color:var(--red);border:1px solid rgba(229,72,77,.35)}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.show{display:block}
.sb{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fi .2s}
.sp{position:absolute;bottom:0;left:0;right:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s ease;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
#toast{z-index:99}

/* ═════════ کارت‌های کشویی ═════════ */
.card.nd{padding:0;overflow:hidden}
.nd .nh{display:block;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.nd .nr{display:flex;align-items:center;gap:10px}
.nd .nt{flex:1;min-width:0}
.nd .nt b{display:block;font-size:14px;line-height:1.5}
.nd .ns{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:20px;
  opacity:1;transition:opacity .2s,max-height .3s}
.nd.open .ns{opacity:0;max-height:0}
.nd .nm{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.nd .tag.cnt{background:rgba(47,124,246,.1);color:var(--ac)}
.nd .chev{width:18px;height:18px;flex:none;color:var(--hint);transition:transform .3s cubic-bezier(.2,.8,.2,1),color .2s}
.nd.open .chev{transform:rotate(180deg);color:var(--ac)}
.nbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.2,.8,.2,1)}
.nd.open .nbody{grid-template-rows:1fr}
.nbody>div{overflow:hidden;min-height:0}
.nbi{padding:2px 14px 14px;border-top:1px solid transparent;opacity:0;transform:translateY(-4px);transition:opacity .25s .05s,transform .3s .05s}
.nd.open .nbi{opacity:1;transform:none;border-top-color:var(--bg2)}
.nd .nbi{padding-top:12px}
.tray{background:rgba(127,127,127,.13);border-radius:12px;padding:6px 6px 7px;margin-top:10px}
.tray .krow{margin-top:5px}.tray .krow:first-child{margin-top:0}
.krow.rk button.kb{border:0;border-radius:6px;background:var(--bg);box-shadow:0 1px 0 rgba(127,127,127,.4)}
.pvhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}
.pvhd .muted{font-size:12.5px}
.pvhd button{white-space:nowrap;flex:none}
.rise{animation:riseIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* انتخاب نوع دکمه‌ها */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 6px 6px;background:transparent;color:var(--hint);
  border:1px solid rgba(127,127,127,.26);border-radius:10px;line-height:1.4;transition:border-color .18s,background .18s,color .18s}
.seg button svg{width:38px;height:28px;margin-bottom:1px}
.seg button b{color:var(--tx);font-weight:600;font-size:12px}
.seg button small{font-size:10px}
.seg button.on{border-color:var(--ac);color:var(--ac);background:rgba(47,124,246,.06)}

/* ═════════ انیمیشن ساخت ═════════ */
.build{position:relative;background:var(--bg);border-radius:14px;padding:11px 13px 12px;margin-bottom:10px;overflow:hidden;
  border:1px solid rgba(47,124,246,.2);animation:pop .35s ease}
.build .bh{display:flex;align-items:center;gap:10px}
.build .bt{flex:1;min-width:0}
.build .bt b{display:block;font-size:13px;line-height:1.4}
.build .ph{display:block;font-size:11.5px;color:var(--hint);transition:opacity .3s,transform .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.build .ph.out{opacity:0;transform:translateY(3px)}
.build .clk{font-size:11px;color:var(--hint);direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  background:var(--bg2);border-radius:99px;padding:1px 8px}
.core{width:34px;height:34px;flex:none;overflow:visible}
.core .glow{fill:var(--ac);opacity:.16;animation:glow 2.4s ease-in-out infinite;transform-origin:50% 50%}
.core .r1{fill:none;stroke:var(--ac);stroke-opacity:.4;stroke-width:1;stroke-dasharray:1.5 4.5;transform-origin:50% 50%;animation:s 16s linear infinite}
.core .arc{fill:none;stroke:url(#gA);stroke-width:2.2;stroke-linecap:round;transform-origin:50% 50%;animation:s 2.6s cubic-bezier(.5,0,.5,1) infinite}
.core .arc2{fill:none;stroke:#34c3ff;stroke-opacity:.7;stroke-width:1.4;stroke-linecap:round;transform-origin:50% 50%;animation:s 4.2s linear infinite reverse}
.core .orb1{fill:#9b6bff;transform-origin:50% 50%;animation:s 5s linear infinite}
.core .cpu{fill:url(#gA);transform-origin:50% 50%;animation:chip 3.6s ease-in-out infinite}
.core .eye{fill:var(--bg)}
@keyframes glow{50%{transform:scale(1.5);opacity:.05}}
@keyframes chip{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(.86)}}
.bp{position:relative;display:flex;align-items:flex-start;gap:10px;margin:9px 0 9px;padding:8px 10px;border-radius:10px;background:var(--bg2);overflow:hidden}
.bp::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(127,127,127,.25) 1px,transparent 0);
  background-size:13px 13px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
.bp .msg{position:relative;flex:0 0 52%;background:var(--bg);border-radius:9px 9px 9px 3px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.bp .msg i{display:block;height:4px;border-radius:3px;background:rgba(127,127,127,.3);width:var(--w);transform-origin:100% 50%;animation:lineIn 4.8s ease-in-out infinite;animation-delay:calc(var(--k)*.18s)}
.bp .msg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(47,124,246,.12) 50%,transparent 70%);
  transform:translateX(100%);animation:sh2 2.2s ease-in-out infinite}
.bp .keys{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.bp .keys b{height:15px;border-radius:6px;background:var(--bg);border:1px solid rgba(47,124,246,.35);opacity:0;
  animation:keyIn 4.8s ease-in-out infinite;animation-delay:calc(.9s + var(--k)*.22s)}
@keyframes lineIn{0%{transform:scaleX(0);opacity:0}14%{opacity:1}30%,86%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes keyIn{0%,6%{opacity:0;transform:translateY(5px) scale(.94)}20%,76%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes sh2{to{transform:translateX(-100%)}}
.steps{display:flex}
.st{position:relative;flex:1;text-align:center;font-size:10.5px;color:var(--hint);line-height:1.4;transition:color .3s}
.st::before{content:"";position:absolute;top:4px;left:-50%;width:100%;height:2px;background:rgba(127,127,127,.22);transition:background .5s}
.st:last-child::before{display:none}
.st.done::before{background:var(--ac)}
.st i{position:relative;z-index:1;display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 4px;background:var(--bg);
  border:2px solid rgba(127,127,127,.35);transition:background .3s,border-color .3s}
.st.done i{background:var(--ac);border-color:var(--ac)}
.st.done i::after{content:"";position:absolute;left:1.8px;top:.1px;width:2px;height:4.4px;border:solid var(--act);border-width:0 1.4px 1.4px 0;transform:rotate(40deg)}
.st.cur{color:var(--tx)}
.st.cur i{border-color:var(--ac);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,124,246,.45)}100%{box-shadow:0 0 0 8px rgba(47,124,246,0)}}
.build .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(127,127,127,.14);overflow:hidden}
.build .prog::after{content:"";position:absolute;left:0;top:0;bottom:0;width:38%;background:linear-gradient(90deg,transparent,var(--ac),#9b6bff,transparent);
  animation:slide 1.7s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(270%)}}
@media (prefers-reduced-motion:reduce){
  .core *,.bp .msg i,.bp .msg::after,.bp .keys b,.build .prog::after,.st.cur i,.rise{animation:none!important}
  .bp .keys b{opacity:1}.nbody,.nbi,.nd .chev{transition:none}
}

/* ═════════ نوار پایین (دوک) ═════════ */
body{--dockh:calc(84px + env(safe-area-inset-bottom))}
body.dock-closed{--dockh:calc(30px + env(safe-area-inset-bottom))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;touch-action:none;
  transition:transform .42s cubic-bezier(.3,.9,.25,1)}
.dock.closed{transform:translateY(100%)}
.dock.hide{transform:translateY(calc(100% + 40px))}
.dock .tab{position:absolute;left:50%;bottom:100%;width:76px;height:24px;margin:0 0 0 -38px;padding:0;border-radius:15px 15px 0 0;
  background:var(--bg);color:var(--hint);display:grid;place-items:center;box-shadow:0 -5px 14px rgba(0,0,0,.08)}
.dock .tab::before,.dock .tab::after{content:"";position:absolute;bottom:0;width:12px;height:12px}
.dock .tab::before{right:100%;border-bottom-right-radius:12px;box-shadow:6px 6px 0 6px var(--bg)}
.dock .tab::after{left:100%;border-bottom-left-radius:12px;box-shadow:-6px 6px 0 6px var(--bg)}
.dock .tab svg{width:20px;height:20px;transition:transform .4s cubic-bezier(.3,.9,.25,1)}
.dock.closed .tab svg{transform:rotate(180deg)}
.dock .tab i{position:absolute;top:5px;width:22px;height:3px;border-radius:2px;background:currentColor;opacity:.28}
.dpanel{display:flex;justify-content:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);box-shadow:0 -6px 22px rgba(0,0,0,.09)}
.dock .dn{width:auto;flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px 6px;
  background:transparent;color:var(--hint);font-size:11.5px;border-radius:14px;transition:color .2s,background .2s}
.dock .dn svg{width:22px;height:22px}
.dock .dn.on{color:var(--ac);background:rgba(47,124,246,.1)}
.dock .dn.on svg{filter:drop-shadow(0 0 5px rgba(47,124,246,.45))}
.dock button:focus-visible,.nd .nh:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#toast{bottom:calc(var(--dockh) + 12px);transition:opacity .2s,bottom .42s}

/* ═════════ پروفایل ═════════ */
.pf{position:relative;overflow:hidden;text-align:center;padding:24px 16px 18px;animation:pop .3s ease}
.pf::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(127,127,127,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(127,127,127,.12) 1px,transparent 1px);
  background-size:18px 18px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%)}
.pf>*{position:relative}
.av{position:relative;width:84px;height:84px;margin:0 auto 12px}
.av .ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--ac),#9b6bff,#34c3ff,var(--ac));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
  animation:s 14s linear infinite}
.av .img{position:absolute;inset:0;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:32px;font-weight:700;color:var(--ac);overflow:hidden}
.av .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf h2{font-size:18px;margin:0}
.pf .un{direction:ltr;display:inline-block;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--hint)}
.stat .v{font-size:24px;font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:400;color:var(--hint)}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{flex:1;height:5px;border-radius:3px;background:rgba(127,127,127,.22)}
.pips i.on{background:linear-gradient(90deg,var(--ac),#9b6bff)}
.quota{display:flex;align-items:center;gap:14px;grid-column:1/-1}
.quota svg{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.quota circle{fill:none;stroke-width:5;stroke-linecap:round}
.quota .tr{stroke:rgba(127,127,127,.2)}
.quota .fg{stroke:url(#gQ);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.quota .qv{font-size:13.5px;line-height:1.7}
.quota .qv b{font-size:20px;font-variant-numeric:tabular-nums}
.kv{padding:4px 14px}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bg2);font-size:13.5px}
.kv div:first-child{border-top:0}
.kv span{color:var(--hint)}
.kv b{font-weight:500}
.kv .cpy{cursor:pointer;direction:ltr;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.kv .cpy svg{width:14px;height:14px;color:var(--hint)}
/* ═════════ ویرایشگر متغیر و شرط ═════════ */
.cmd select{flex:1;min-width:0}
details.adv{margin-top:14px;border:1px solid rgba(127,127,127,.22);border-radius:12px;padding:0 12px}
details.adv>summary{cursor:pointer;padding:10px 0;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:"＋";color:var(--hint)}
details.adv[open]>summary::after{content:"－"}
details.adv .box{padding:0 0 12px}
.sub{font-size:12.5px;font-weight:600;margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center}
.rl{background:var(--bg2);border-radius:11px;padding:8px;margin-bottom:8px}
.rl .cmd{margin-bottom:6px}.rl .cmd:last-child{margin-bottom:0}
.rl input,.rl select,.rl textarea{padding:8px 9px;font-size:13px;border-radius:9px;background:var(--bg)}
.rl textarea{min-height:64px}
.rl>input{margin-top:0}
.rl .lbl{margin:6px 0 3px}
.kvr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--bg2);font-size:12.5px}
.kvr:first-of-type{border-top:0}
.kvr code{font-family:ui-monospace,Menlo,monospace;color:var(--ac);font-size:12px}
.kvr span{color:var(--hint)}
/* ═════════ کیف توکن ═════════ */
.chip{cursor:pointer}
.wl{position:relative;overflow:hidden;text-align:center;padding:20px 14px 16px;background:linear-gradient(135deg,rgba(47,124,246,.14),rgba(155,107,255,.12))}
.wl .k{font-size:12.5px;color:var(--hint)}
.wl .big{font-size:42px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--ac),#9b6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl .big small{font-size:16px;-webkit-text-fill-color:var(--hint)}
.wl button{margin-top:12px}
.flame{display:flex;gap:5px;justify-content:center;margin-top:10px}
.flame i{width:26px;height:6px;border-radius:3px;background:rgba(127,127,127,.25)}
.flame i.on{background:linear-gradient(90deg,#ff9f43,#ff5e62)}
.lnk{direction:ltr;text-align:left;background:var(--bg2);border-radius:11px;padding:9px 11px;font-size:12.5px;word-break:break-all;margin:8px 0;cursor:pointer}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.mini div{background:var(--bg2);border-radius:11px;padding:8px 10px;text-align:center;font-size:12px;color:var(--hint)}
.mini b{display:block;font-size:19px;color:var(--tx);font-variant-numeric:tabular-nums}
.led{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bg2);font-size:13px}
.led:first-child{border-top:0}
.led small{display:block;color:var(--hint);font-size:11px}
.led b{font-variant-numeric:tabular-nums;direction:ltr}
.led b.p{color:var(--green)}.led b.m{color:var(--red)}
.price{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid var(--bg2)}
.price:first-of-type{border-top:0}
.price span{color:var(--hint)}
.dock .dn{max-width:120px}
</style>
</head>
<body>
<div class="top"><h1>🤖 ابر ربات‌ساز</h1><span class="chip" id="quota"></span></div>
<div id="app"></div>
<div id="sheet" class="sheet"></div>
<div id="toast"></div>
<nav class="dock" id="dock" aria-label="ناوبری اصلی">
  <button class="tab" id="dockTab" aria-label="باز و بسته کردن نوار پایین" aria-expanded="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></svg>
  </button>
  <div class="dpanel">
    <button class="dn" data-d="bots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3.5"/><path d="M12 8V4.5"/><circle cx="12" cy="3.6" r="1"/><circle cx="9" cy="13.5" r="1.1" fill="currentColor"/><circle cx="15" cy="13.5" r="1.1" fill="currentColor"/><path d="M2.5 12.5v2M21.5 12.5v2"/></svg>
      <span>ربات‌ها</span>
    </button>
    <button class="dn" data-d="wallet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.6 9.6c0-1 1-1.6 2.4-1.6s2.4.6 2.4 1.6c0 2.2-4.8 1.1-4.8 3.4 0 1 1 1.6 2.4 1.6s2.4-.6 2.4-1.6"/></svg>
      <span>توکن</span>
    </button>
    <button class="dn" data-d="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg>
      <span>پروفایل</span>
    </button>
  </div>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const INIT = tg?.initData || "";
// خالی = همون دامنه‌ای که این صفحه ازش لود شده (حالت پیش‌فرض). فقط اگه index.html رو جدا هاست کردی آدرس بک‌اند رو بذار:
const API_BASE = "";
let S = { open: new Set(), w: null, bots: [], view: new URLSearchParams(location.search).get("v") === "wallet" ? "wallet" : "list", cur: null, busy: false, edit: null, dirty: false, fresh: false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2800); }

async function api(path, method="GET", body){
  const r = await fetch(API_BASE + path, { method, headers: {"Content-Type":"application/json","X-Init-Data":INIT}, body: body?JSON.stringify(body):undefined });
  const d = await r.json().catch(()=>({}));
  if(!r.ok){ const er = new Error(d.error || "خطا در ارتباط با سرور"); er.code = d.code; throw er; }
  return d;
}

async function load(){
  try{
    const d = await api("/api/me");
    S.bots = d.bots; S.w = d.wallet;
  }catch(e){ $("#dock").hidden = true; $("#app").innerHTML = `<div class="card empty"><p>این برنامه فقط داخل تلگرام کار می‌کنه.<br><span class="muted">از ربات مادر دکمه‌ی «ساخت ربات» رو بزن.</span></p></div>`; return; }
  render();
}

function render(){
  if(!S.w) return;
  $("#quota").textContent = `🪙 ${fa(S.w.tokens)} توکن`;
  S.view === "list" ? renderList() : S.view === "profile" ? renderProfile() : S.view === "wallet" ? renderWallet() : renderBot();
  syncDock();
}

function renderList(){
  const w = S.w, full = S.bots.length >= w.slots;
  const list = S.bots.map(b => `
    <div class="card bot" data-id="${b.id}">
      <span class="dot ${b.active?"on":""}"></span>
      <div><b>${esc(b.name)}</b><span class="muted">${b.active ? "@"+esc(b.username) : "هنوز فعال نشده"}</span></div>
    </div>`).join("");
  $("#app").innerHTML = (list || `<div class="card empty"><p>هنوز رباتی نساختی.<br><span class="muted">یه جمله بنویس، ربات آماده می‌شه. فروشگاه، پشتیبانی، کوییز، چت هوشمند، فروش اشتراک…</span></p></div>`)
    + (!full ? `<button id="new">＋ ساخت ربات جدید</button>`
      : w.slots < w.max_bots ? `<button id="slot">🔓 خرید اسلات ربات (${fa(w.slot_cost)} توکن)</button><p class="muted" style="text-align:center;margin-top:8px">ظرفیتت پر شده: ${fa(S.bots.length)} از ${fa(w.slots)}</p>`
      : `<p class="muted" style="text-align:center">به سقف ${fa(w.max_bots)} ربات رسیدی</p>`);
  document.querySelectorAll(".bot").forEach(el => el.onclick = () => { S.cur = S.bots.find(b=>b.id===el.dataset.id); S.view="bot"; S.open = new Set(); render(); });
  $("#new")?.addEventListener("click", () => { S.cur = null; S.view = "bot"; S.open = new Set(); render(); });
  $("#slot")?.addEventListener("click", () => go("wallet"));
}

const CH_RE = /^https:\/\/t\.me\/([A-Za-z][A-Za-z0-9_]{4,31})\/?$/;
const NAME_RE = /^@?([A-Za-z][A-Za-z0-9_]{4,31})$/;
const cp = o => JSON.parse(JSON.stringify(o));

const titleOf = (cfg, id) => { const n = cfg.nodes[id]; return n ? (n.title || (n.text||"").replace(/\s+/g," ").slice(0,24) || id) : "؟"; };
const kindOf = b => b.goto !== undefined ? "goto" : b.alert !== undefined ? "alert" : b.copy !== undefined ? "copy" : CH_RE.test(b.url||"") ? "channel" : "url";
const btnInfo0 = (cfg, b) => {
  const k = kindOf(b);
  return k==="goto" ? "← "+esc(titleOf(cfg,b.goto)) : k==="channel" ? "📢 @"+esc(CH_RE.exec(b.url)[1])
    : k==="alert" ? "💬 پیام پاپ‌آپ" : k==="copy" ? "📋 کپی متن" : "🔗 "+esc((b.url||"").replace(/^https:\/\//,"").slice(0,22));
};
const btnInfo = (cfg, b) => btnInfo0(cfg, b) + (b.when ? " · 👁 شرطی" : "") + (b.do?.length ? " · ⚡" : "");

const fa = n => Number(n || 0).toLocaleString("fa-IR");
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function nodeCard(cfg, id, i = 0, rise = false){
  const n = cfg.nodes[id], tags = [], isRk = n.kb === "reply";
  if(id===cfg.start) tags.push("شروع");
  if(id===cfg.fallback) tags.push("پیام ناشناس");
  if(n.fields) tags.push("فرم");
  else if(n.ask) tags.push("دریافت پیام");
  if(isRk) tags.push("⌨️ کیبورد چت");
  const mk = ["photo","video","file","audio"].find(k => n[k]);
  if(mk) tags.push({photo:"🖼 عکس",video:"🎬 ویدیو",file:"📎 فایل",audio:"🎵 صدا"}[mk]);
  if(n.ai) tags.push("🤖 چت هوشمند");
  if(n.receipt) tags.push("🧾 دریافت رسید");
  if(n.top) tags.push("🏆 لیدربورد");
  if(n.do?.length || n.route?.length || n.alt?.length) tags.push("🧩 منطق");
  const open = S.open.has(id), nb = n.buttons.reduce((a,r) => a + r.length, 0);
  const prev = (n.text||"").replace(/\s+/g," ").slice(0,70);
  const kb = n.buttons.map((row,r) => `<div class="krow${isRk?" rk":""}">${row.map((b,c) =>
      `<button class="kb" data-sa="btn" data-n="${id}" data-r="${r}" data-c="${c}">${esc(b.text)}<small>${btnInfo(cfg,b)}</small></button>`).join("")}
      ${row.length<3 ? `<button class="kb add" data-sa="newbtn" data-n="${id}" data-r="${r}">＋</button>` : ""}</div>`).join("");
  return `
    <div class="card nd${open?" open":""}${rise?" rise":""}" style="--i:${Math.min(i,8)}">
      <div class="nh" role="button" tabindex="0" aria-expanded="${open}" data-sa="toggle" data-n="${id}">
        <div class="nr"><div class="nt"><b>${esc(titleOf(cfg,id))}</b><span class="ns">${esc(prev)}</span></div>${CHEV}</div>
        <div class="nm">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}<span class="tag cnt">${nb ? fa(nb)+" دکمه" : "بدون دکمه"}</span></div>
      </div>
      <div class="nbody"><div><div class="nbi">
        <div class="bubble" data-sa="node" data-n="${id}">${esc(n.text)}<span class="pen">✏️</span></div>
        ${n.fields ? `<div class="muted" style="margin-top:6px">سؤال‌ها: ${n.fields.map((q,i) => esc(q) + (n.save?.[i] ? ' <span class="tag" dir="ltr">{' + esc(n.save[i]) + '}</span>' : "")).join(" ← ")}</div>` : ""}
        ${isRk ? `<div class="tray">${kb}</div>` : kb}
        ${n.buttons.length<6 ? `<button class="kb add wide" data-sa="newrow" data-n="${id}">＋ دکمه‌ی جدید</button>` : ""}
      </div></div></div>
    </div>`;
}

function toggleNode(id, head){
  const card = head.closest(".nd"), o = card.classList.toggle("open");
  head.setAttribute("aria-expanded", o);
  o ? S.open.add(id) : S.open.delete(id);
  syncAll();
  tg?.HapticFeedback?.selectionChanged();
}
function toggleAll(){
  const ids = Object.keys(S.cur.config.nodes), all = ids.every(i => S.open.has(i));
  S.open = all ? new Set() : new Set(ids);
  document.querySelectorAll(".nd").forEach((el,i) => {
    el.classList.toggle("open", !all); el.querySelector(".nh").setAttribute("aria-expanded", !all);
  });
  syncAll();
}
function syncAll(){
  const b = $("#allbtn"); if(!b || !S.cur) return;
  b.textContent = Object.keys(S.cur.config.nodes).every(i => S.open.has(i)) ? "بستن همه" : "باز کردن همه";
}

function renderBot(){
  const b = S.cur;
  const prompt = `
    <div class="card">
      <h2>${b ? "چی رو تغییر بدم؟" : "چه رباتی می‌خوای؟"}</h2>
      <textarea id="prompt" maxlength="2000" placeholder="${b ? "مثلاً: یه دکمه‌ی پشتیبانی اضافه کن" : "مثلاً: ربات فروشگاه لوازم جانبی موبایل با منوی محصولات و دکمه‌ی سفارش"}"></textarea>
      <div style="height:10px"></div>
      <button id="gen">${b ? "ارتقا بده" : "بساز"}</button>
      <p class="muted" style="margin-top:8px;text-align:center">🪙 هزینه‌ی تقریبی: ${fa(b ? S.w.est.update : S.w.est.create)} توکن · موجودی: ${fa(S.w.tokens)}</p>
    </div>
    <div id="live"></div>`;
  let body = "";
  if(b){
    body += `<div class="think${b.thinking?" show":""}" id="think"><span class="ic">✨</span><span class="tt">${S.fresh ? "" : esc(b.thinking||"")}</span></div>`;
    body += `<div class="hd" style="padding:2px 2px 8px"><h2 style="font-size:14px">پیش‌نمایش ربات</h2><button class="sm ghost" data-sa="bot">⚙️ تنظیمات ربات</button></div>
             <div class="pvhd"><span class="muted">هر بخش رو باز کن، بعد روی متن یا دکمه بزن تا ویرایشش کنی.</span><button class="sm ghost" id="allbtn" data-sa="toggleall">باز کردن همه</button></div>`;
    body += Object.keys(b.config.nodes).map((id,i) => nodeCard(b.config, id, i, S.fresh)).join("");
    body += `<button class="ghost" data-sa="addnode" style="margin-bottom:12px">＋ بخش جدید</button>`;
    body += `<button class="ghost" data-sa="manage" style="margin-bottom:12px">📊 آمار، ارسال همگانی و خروجی اکسل</button>`;
    if(b.versions) body += `<button class="ghost" id="undo" style="margin-bottom:12px">↩ برگشت به نسخه‌ی قبلی</button>`;
    body += b.active
      ? `<div class="card"><h2>🟢 فعاله: @${esc(b.username)}</h2><p class="muted" style="margin-bottom:10px">تغییرات بلافاصله روی ربات اعمال می‌شن. برای دریافت پیام‌های کاربرها، یک بار ربات خودت رو استارت کن.</p><button class="ghost" id="off">غیرفعال کردن</button></div>`
      : `<div class="card"><h2>فعال‌سازی</h2><p class="muted" style="margin-bottom:10px">ربات رو از @BotFather بساز و توکنش رو اینجا بذار.</p><input id="token" placeholder="123456:ABC..." autocomplete="off"><div style="height:10px"></div><button id="act">فعال کن</button></div>`;
    body += `<button class="danger" id="del">حذف ربات</button>`;
  }
  $("#app").innerHTML = `<button class="back" id="back">← بازگشت</button>${prompt}${body}`;
  $("#back").onclick = () => { S.view="list"; S.cur=null; closeSheet(); load(); };
  $("#gen").onclick = generate;
  $("#undo")?.addEventListener("click", undo);
  $("#act")?.addEventListener("click", activate);
  $("#off")?.addEventListener("click", () => act("deactivate", "ربات غیرفعال شد"));
  $("#del")?.addEventListener("click", remove);
  syncAll();
  if(S.fresh && b?.thinking){ typeText($("#think .tt"), b.thinking); $("#think").scrollIntoView({behavior:"smooth",block:"nearest"}); }
  S.fresh = false;
}

/* ───────── تایپ تدریجی توضیح هوش مصنوعی ───────── */
function typeText(el, text){
  const id = ++typeText.id;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent = text; return; }
  let i = 0; el.textContent = "";
  (function step(){
    if(id !== typeText.id || !el.isConnected) return;
    i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i);
    if(i < text.length) setTimeout(step, 16);
  })();
}
typeText.id = 0;

/* ───────── انیمیشن ساخت ربات ───────── */
const STEPS = ["درک درخواست","طراحی مسیرها","ساخت بخش‌ها","بازبینی نهایی"];
const PHASES = [["دارم درخواستت رو می‌خونم…",0],["ببینم ربات واقعاً به چی نیاز داره…",0],["مسیر کاربرها رو طراحی می‌کنم…",1],
  ["بخش‌ها و دکمه‌ها رو می‌چینم…",2],["متن‌ها رو می‌نویسم…",2],["یه بررسی نهایی می‌کنم…",3]];
const CORE = `<svg class="core" viewBox="0 0 48 48" aria-hidden="true">
  <defs><linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac)"/><stop offset="1" stop-color="#9b6bff"/></linearGradient></defs>
  <circle class="glow" cx="24" cy="24" r="13"/>
  <circle class="r1" cx="24" cy="24" r="22"/>
  <path class="arc" d="M24 5a19 19 0 0 1 16.5 9.5"/>
  <path class="arc2" d="M24 43a19 19 0 0 1-16.5-9.5"/>
  <g class="orb1"><circle cx="24" cy="2.6" r="2"/></g>
  <rect class="cpu" x="17" y="17" width="14" height="14" rx="4.5"/>
  <circle class="eye" cx="21.4" cy="24" r="1.3"/><circle class="eye" cx="26.6" cy="24" r="1.3"/>
</svg>`;
function startLive(){
  const box = $("#live"); if(!box) return;
  $("#think")?.classList.remove("show");
  box.innerHTML = `<div class="build" role="status" aria-live="polite">
    <div class="bh">${CORE}<div class="bt"><b>در حال طراحی ربات</b><span class="ph" id="ph">${PHASES[0][0]}</span></div><span class="clk" id="clk">00:00</span></div>
    <div class="bp"><div class="msg"><i style="--w:92%;--k:0"></i><i style="--w:70%;--k:1"></i><i style="--w:44%;--k:2"></i></div>
      <div class="keys"><b style="--k:0"></b><b style="--k:1"></b><b style="--k:2"></b><b style="--k:3"></b></div></div>
    <div class="steps" id="steps">${STEPS.map(t=>`<div class="st"><i></i>${t}</div>`).join("")}</div>
    <div class="prog"></div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"center"});
  const t0 = Date.now(); let i = 0;
  clearInterval(startLive.t); clearInterval(startLive.c);
  setStep(0);
  startLive.t = setInterval(() => {
    const ph = $("#ph"); if(!ph) return clearInterval(startLive.t);
    ph.classList.add("out");
    setTimeout(() => { i = Math.min(i + 1, PHASES.length - 1); ph.textContent = PHASES[i][0]; setStep(PHASES[i][1]); ph.classList.remove("out"); }, 280);
  }, 2800);
  startLive.c = setInterval(() => {
    const c = $("#clk"); if(!c) return clearInterval(startLive.c);
    const sec = Math.floor((Date.now() - t0) / 1000);
    c.textContent = String(Math.floor(sec / 60)).padStart(2,"0") + ":" + String(sec % 60).padStart(2,"0");
  }, 1000);
}
function setStep(k){ document.querySelectorAll("#steps .st").forEach((el,j) => { el.classList.toggle("done", j < k); el.classList.toggle("cur", j === k); }); }
function stopLive(){ clearInterval(startLive.t); clearInterval(startLive.c); const box = $("#live"); if(box) box.innerHTML = ""; }

/* ───────── ویرایشگر سریع (شیت پایین صفحه) ───────── */
let D = null;   // پیش‌نویس فرم باز
async function commit(fn, msg="ذخیره شد ✅"){
  const cfg = cp(S.cur.config); fn(cfg);
  const d = await api(`/api/bots/${S.cur.id}/config`, "PUT", {config: cfg});
  S.cur = d.bot; closeSheet(); renderBot(); toast(msg);
  tg?.HapticFeedback?.notificationOccurred("success");
}
function closeSheet(){ $("#sheet").classList.remove("show"); $("#sheet").innerHTML = ""; S.sheet = null; D = null; }
function showSheet(html){
  const sh = $("#sheet"), keep = sh.querySelector(".sp")?.scrollTop || 0;
  sh.innerHTML = `<div class="sb" data-x="close"></div><div class="sp">${html}</div>`;
  sh.classList.add("show"); sh.querySelector(".sp").scrollTop = keep;
}

const ACTS = [["set","مقدار بده"],["add","جمع کن / کم کن"],["clear","پاک کن"],["random","عدد تصادفی"],["notify","به من خبر بده"],["remind","یادآوری به کاربر"]];

  ["lang","زبان تلگرام (fa, en…)"],["premium","پریمیوم؟ ۱ یا ۰"],["is_owner","صاحب ربات؟ ۱ یا ۰"],["visits","تعداد استارت‌های کاربر"],["text","آخرین پیام کاربر"],
  ["param","پارامتر لینک /start"],["date","تاریخ شمسی"],["time","ساعت تهران"],["hour","ساعت (۰ تا ۲۳)"],["weekday","روز هفته"],["bot_name","نام ربات"],["bot_username","آیدی ربات"]];

const cleanVar = v => String(v || "").toLowerCase().replace(/[^a-z0-9_]/g, "").replace(/^[0-9_]+/, "").slice(0, 20);
const simpleCond = c => !!c && typeof c.var === "string" && !c.all && !c.any && !c.not;

function condHTML(c){
  if(c && !simpleCond(c)) return `<div class="muted" style="padding:2px 2px 4px">🔀 شرط ترکیبی؛ فقط با هوش مصنوعی عوض می‌شه</div>`;

}
function ruleHTML(list, o, i, cfg){
  const del = `<button class="sm x" data-sh="delrl" data-l="${list}" data-i="${i}">✕</button>`;
  let inner;
  if(list === "do" || list === "rdo"){
    inner = `<div class="cmd"><select class="a-op" data-sh="re">${ACTS.map(([v,l]) => `<option value="${v}"${v===o.op?" selected":""}>${l}</option>`).join("")}</select>
      ${o.op === "notify" || o.op === "remind" ? "" : `<input class="a-var" list="vdl" value="${esc(o.var || "")}" placeholder="نام متغیر" maxlength="20" autocomplete="off">`}${del}</div>
      ${o.op === "clear" ? "" : `<input class="fa a-val" value="${esc(o.value || "")}" placeholder="${esc(APH[o.op])}" maxlength="${o.op==="notify"?500:100}">`}

  } else {
    inner = `<div class="cmd" style="justify-content:space-between"><span class="muted">${list === "when" ? "فقط وقتی…" : "اگه…"}</span>${del}</div>${condHTML(o.c)}`;
    if(list === "route") inner += `<span class="lbl" style="margin:6px 0 3px">بعدش برو به</span><select class="r-goto">${nodeOpts(cfg, o.goto)}</select>`;
    if(list === "alt") inner += `<textarea class="fa r-text" maxlength="3500" placeholder="متن جایگزین">${esc(o.text || "")}</textarea>`;
  }
  return `<div class="rl" data-list="${list}" data-i="${i}">${inner}</div>`;
}
function ruleSection(title, hint, list, cfg, max){
  const arr = D[list];
  return `<div class="sub"><span>${title}</span>${arr.length < max ? `<button class="sm ghost" data-sh="addrl" data-l="${list}">＋</button>` : ""}</div>
    ${hint ? `<p class="muted" style="margin:-3px 0 6px">${hint}</p>` : ""}${arr.map((o,i) => ruleHTML(list, o, i, cfg)).join("")}`;
}
function readRl(list){
  const rows = [...document.querySelectorAll(`.rl[data-list="${list}"]`)];
  if(!rows.length || !D[list]) return;
  D[list] = rows.map((r,i) => {
    const o = {...(D[list][i] || {})}, q = s => r.querySelector(s);
    if(q(".c-var")) o.c = {var:cleanVar(q(".c-var").value), op:q(".c-op").value, value:q(".c-val")?.value ?? ""};
    if(q(".r-goto")) o.goto = q(".r-goto").value;
    if(q(".r-text")) o.text = q(".r-text").value;
    if(q(".a-op")){
      o.op = q(".a-op").value;
      o.var = q(".a-var") ? cleanVar(q(".a-var").value) : (o.var || "");
      o.value = q(".a-val") ? q(".a-val").value : (o.value || "");
      if(q(".a-goto")) o.goto = q(".a-goto").value; else if(o.op !== "remind") delete o.goto;
    }
    return o;
  });
}
function ruleErr(){
  const empty = c => c && simpleCond(c) && !c.var;
  for(const a of [...(D.do || []), ...(D.rdo || [])]){
    if(a.op === "notify"){ if(!(a.value || "").trim()) return "متن اعلانِ اکشن «به من خبر بده» رو بنویس"; }
    else if(a.op === "remind"){ if(!(+a.value >= 1 && +a.value <= 10080)) return "زمان یادآوری باید بین ۱ تا ۱۰۰۸۰ دقیقه باشه"; }
    else if(!a.var) return "اسم متغیرِ اکشن رو بنویس";
  }
  for(const r of D.route || []) if(empty(r.c)) return "برای هدایت شرطی، اسم متغیرِ شرط رو بنویس";
  for(const r of D.alt || []){
    if(empty(r.c)) return "برای متن جایگزین، اسم متغیرِ شرط رو بنویس";
    if(!(r.text || "").trim()) return "متن جایگزین نباید خالی باشه";
  }
  for(const r of D.when || []) if(empty(r.c)) return "برای نمایش شرطیِ دکمه، اسم متغیرِ شرط رو بنویس";
  return null;
}

function saveNode(){

  const err = ruleErr(); if(err) return toast(err);
  busy($('[data-sh="save"]'), () => commit(cfg => {
    const n = cfg.nodes[id];
    for(const k of ["title","photo","video","file","audio","ai","receipt","top","ask","fields","save","types","silent","done","next","kb","do","route","alt"]) delete n[k];
    if(D.mode==="show" && D.kb==="reply") n.kb = "reply";
    n.text = D.text.trim();
    if(D.title.trim()) n.title = D.title.trim();
    if(D.mv.trim()) n[D.mk] = D.mv.trim();
    if(D.mode==="ask") n.ask = true;
    if(D.mode==="ai") n.ai = {system:D.ai.system.trim(), limit:Math.max(1, Math.min(200, +D.ai.limit || 20))};
    if(D.mode==="receipt"){
      n.receipt = {};
      if(D.rc.ok.trim()) n.receipt.ok = D.rc.ok.trim();
      if(D.rc.no.trim()) n.receipt.no = D.rc.no.trim();
      if(D.rdo.length) n.receipt.do = outActs(D.rdo);
    }
    if(D.top.on && D.top.var) n.top = {var:D.top.var, n:Math.max(3, Math.min(20, +D.top.n || 10)), title:D.top.title.trim() || "🏆 برترین‌ها"};
    if(D.mode==="form"){
      const fl = D.fields.filter(f => f.q.trim());
      n.fields = fl.map(f => f.q.trim());
      if(fl.some(f => f.v)) n.save = fl.map(f => f.v);
      if(fl.some(f => f.t !== "text")) n.types = fl.map(f => f.t);
      if(D.silent) n.silent = true;
    }
    if(["ask","form","receipt"].includes(D.mode)){ if(D.done.trim()) n.done = D.done.trim(); if(D.next) n.next = D.next; }
    if(D.do.length) n.do = outActs(D.do);
    if(D.route.length) n.route = D.route.map(r => ({when:r.c, goto:r.goto}));
    if(D.alt.length) n.alt = D.alt.map(r => ({when:r.c, text:r.text.trim()}));
    if(D.start) cfg.start = id;
    if(D.fb) cfg.fallback = id;
  }));
}
function delNode(){
  const id = S.sheet.id;
  const go = ok => ok && busy($('[data-sh="del"]'), () => commit(cfg => {
    delete cfg.nodes[id];
    for(const n of Object.values(cfg.nodes)){
      n.buttons = n.buttons.map(r => r.filter(b => b.goto !== id)).filter(r => r.length);
      if(n.next === id) delete n.next;
      if(n.route){ n.route = n.route.filter(r => r.goto !== id); if(!n.route.length) delete n.route; }
    }
    for(const k of Object.keys(cfg.commands||{})) if(cfg.commands[k] === id) delete cfg.commands[k];
  }, "بخش حذف شد"));
  const q = "این بخش و دکمه‌هایی که بهش وصلن حذف بشن؟";
  tg?.showConfirm ? tg.showConfirm(q, go) : go(confirm(q));
}
function addNode(){

/* ── هماهنگی شیت‌ها ── */
function renderSheet(){
  showSheet({node:nodeSheet, btn:btnSheet, bot:botSheet, manage:manageSheet}[S.sheet.kind]());
}
function readSheet(){ ({node:readNode, btn:readBtn, bot:readBot, manage:readManage}[S.sheet.kind])(); }

function shAction(a, ds){
  if(!S.sheet) return;
  const prev = D.kind;
  readSheet();
  if(S.sheet.kind==="manage") return manageAct(a, ds);
  if(a==="save") return {node:saveNode, btn:saveBtn, bot:saveBot}[S.sheet.kind]();
  if(a==="del") return S.sheet.kind==="node" ? delNode() : delBtn();
  if(a==="bkind"){
    const k = D.kind, wasText = prev==="channel"||prev==="url";
    if(k==="channel"){ const m = CH_RE.exec(D.val) || NAME_RE.exec(D.val); D.val = m ? "@"+m[1] : ""; }
    else if(k==="url"){ D.val = NAME_RE.test(D.val) ? "https://t.me/"+D.val.replace("@","") : (wasText ? D.val : ""); }
    else if(k!=="goto" && prev!==k) D.val = "";
  }
  else if(a==="kbt") D.kb = ds.v;
  else if(a==="addfld") D.fields.push({q:"", v:"", t:"text"});
  else if(a==="delfld") D.fields.splice(+ds.i, 1), D.fields.length || D.fields.push({q:"", v:"", t:"text"});
  else if(a==="addcmd") D.cmds.push(["help", S.cur.config.start]);
  else if(a==="delcmd") D.cmds.splice(+ds.i, 1);
  else if(a==="addvar") D.vars.push(["", ""]);
  else if(a==="delvar") D.vars.splice(+ds.i, 1);
  else if(a==="addgv") D.gvars.push(["", ""]);
  else if(a==="delgv") D.gvars.splice(+ds.i, 1);
  else if(a==="addrl"){ D[ds.l].push(newRule(ds.l)); D.adv = true; }
  else if(a==="delrl"){ D[ds.l].splice(+ds.i, 1); D.adv = true; }
  renderSheet();
}

document.addEventListener("click", e => {
  const x = e.target.closest("[data-x],[data-sa],[data-sh]"); if(!x || x.tagName==="SELECT") return;
  const ds = x.dataset;
  if(ds.x) return closeSheet();
  if(ds.sh) return shAction(ds.sh, ds);
  const r = ds.r !== undefined ? +ds.r : null;
  if(ds.sa==="node") openNode(ds.n);
  else if(ds.sa==="btn") openBtn(ds.n, r, +ds.c);
  else if(ds.sa==="newbtn") openBtn(ds.n, r, null);
  else if(ds.sa==="newrow") openBtn(ds.n, null, null);
  else if(ds.sa==="bot") openBot();
  else if(ds.sa==="addnode") addNode();
  else if(ds.sa==="toggle") toggleNode(ds.n, x);
  else if(ds.sa==="toggleall") toggleAll();
  else if(ds.sa==="manage") openManage();
});
document.addEventListener("keydown", e => {
  const h = e.target.closest?.('[data-sa="toggle"]');
  if(h && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleNode(h.dataset.n, h); }
});
document.addEventListener("change", e => {
  const a = e.target.dataset.sh;
  if(a==="mode" || a==="bkind" || a==="re") shAction(a, e.target.dataset);
});

async function busy(btn, fn){
  if(S.busy) return; S.busy = true;
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = old + '<span class="spin"></span>';
  try{ await fn(); }catch(e){
    toast(e.message);
    if(e.code === "tokens" || e.code === "slots") setTimeout(() => { if(S.view !== "wallet") go("wallet"); }, 1100);
  }
  S.busy = false; if(btn.isConnected){ btn.disabled = false; btn.innerHTML = old; }
}

function generate(){
  const btn = $("#gen"), ta = $("#prompt"), p = ta.value.trim();
  if(p.length < 5) return toast("توضیح بیشتری بنویس");
  if(S.w.tokens < S.w.min_start){ toast(`حداقل ${fa(S.w.min_start)} توکن لازمه؛ از بخش توکن رایگان بگیر 🎁`); return go("wallet"); }
  busy(btn, async () => {
    ta.readOnly = true; startLive();
    try{
      const d = await api("/api/generate","POST",{ prompt:p, bot_id:S.cur?.id });
      const wasActive = S.cur?.active, upg = !!S.cur;
      S.cur = d.bot; S.w.tokens = d.tokens; S.w.spent += d.cost; S.fresh = true; stopLive(); render();
      toast(`${upg ? (wasActive ? "ربات ارتقا پیدا کرد" : "ربات به‌روز شد") : "ربات ساخته شد"} ✅ · ${fa(d.cost)} توکن مصرف شد`);
      tg?.HapticFeedback?.notificationOccurred("success");
    } finally { stopLive(); ta.readOnly = false; }
  });
}
function undo(){ busy($("#undo"), async () => { const d = await api(`/api/bots/${S.cur.id}/undo`,"POST"); S.cur = d.bot; render(); toast("برگشت داده شد"); }); }
function activate(){
  const t = $("#token").value.trim(); if(!t) return toast("توکن رو وارد کن");
  busy($("#act"), async () => { const d = await api(`/api/bots/${S.cur.id}/activate`,"POST",{token:t}); S.cur = d.bot; render(); toast("ربات فعال شد 🎉"); });
}
function act(action, msg){ busy($("#off"), async () => { const d = await api(`/api/bots/${S.cur.id}/${action}`,"POST"); S.cur = d.bot; render(); toast(msg); }); }
function remove(){
  const go = async ok => { if(!ok) return; await api(`/api/bots/${S.cur.id}`,"DELETE"); S.view="list"; S.cur=null; load(); toast("حذف شد"); };
  tg?.showConfirm ? tg.showConfirm("این ربات برای همیشه حذف بشه؟", go) : go(confirm("حذف بشه؟"));
}

/* ───────── کیف توکن ───────── */
const WHY = {welcome:"🎁 هدیه‌ی ورود", bonus:"📅 پاداش روزانه", referral:"👥 پاداش دعوت", invited:"🎉 هدیه‌ی دعوت‌شده", gift:"🎟 کد هدیه", admin:"⭐ هدیه‌ی مدیر",
  ai_create:"🤖 ساخت ربات", ai_update:"⚡ ارتقای ربات", ai_bot:"💬 چت هوشمند ربات", slot:"🔓 خرید اسلات"};
function renderWallet(){
  const w = S.w, b = w.bonus, st = Math.min(b.streak, 7);
  $("#app").innerHTML = `
    <div class="card wl">
      <div class="k">موجودی توکن شما</div>
      <div class="big">${fa(w.tokens)} <small>توکن</small></div>
      <div class="muted">تا حالا ${fa(w.spent)} توکن مصرف کردی</div>
      <div class="flame">${Array.from({length:7}, (_,i) => `<i class="${i < st ? "on" : ""}"></i>`).join("")}</div>
      <div class="muted" style="margin-top:4px">${b.streak ? `🔥 ${fa(b.streak)} روز پشت‌سرهم` : "هر روز بیای، پاداشت بیشتر می‌شه"}</div>
      <button data-w="bonus"${b.available ? "" : " disabled"}>${b.available ? `🎁 دریافت ${fa(b.amount)} توکن امروز` : "پاداش امروز گرفته شد ✅ فردا برگرد"}</button>
    </div>
    <div class="card">
      <h2>👥 دعوت دوستان = توکن رایگان</h2>
      <p class="muted">به‌ازای هر نفری که با لینک تو وارد بشه <b>${fa(w.ref_reward)}</b> توکن می‌گیری و دوستت هم <b>${fa(w.ref_invitee)}</b> توکن هدیه می‌گیره.${w.ref_every ? ` هر ${fa(w.ref_every)} دعوت هم <b>${fa(w.ref_milestone)}</b> توکن جایزه‌ی ویژه!` : ""}</p>
      <div class="lnk" data-w="copylink">${esc(w.ref_link || "—")}</div>
      <div class="mini"><div><b>${fa(w.refs)}</b>دعوت موفق</div><div><b>${fa(w.ref_earned)}</b>توکنِ دعوت</div></div>
      <div class="row"><button class="ghost" data-w="copylink">📋 کپی لینک</button><button data-w="share">📤 ارسال برای دوستان</button></div>
    </div>
    <div class="card">
      <h2>🔓 اسلات ربات</h2>
      <p class="muted" style="margin-bottom:8px">ظرفیت فعلی: ${fa(S.bots.length)} ربات از ${fa(w.slots)} (${fa(w.free_bots)} ربات رایگانه). سقف: ${fa(w.max_bots)} ربات.</p>
      <button class="ghost" data-w="slot"${w.slots >= w.max_bots ? " disabled" : ""}>خرید یک اسلات جدید — ${fa(w.slot_cost)} توکن</button>
    </div>
    <div class="card">
      <h2>🎟 کد هدیه</h2>
      <div class="row"><input id="code" placeholder="CODE" autocomplete="off" maxlength="30" style="flex:2"><button data-w="redeem" style="flex:1">ثبت</button></div>
    </div>
    <div class="card">
      <h2>🧮 هزینه‌ها</h2>
      <div class="price"><span>ساخت ربات جدید (تقریبی)</span><b>${fa(w.est.create)} توکن</b></div>
      <div class="price"><span>ارتقا یا توسعه‌ی ربات (تقریبی)</span><b>${fa(w.est.update)} توکن</b></div>
      <div class="price"><span>هر جواب چت هوشمند داخل ربات</span><b>۱ تا ۳ توکن</b></div>
      <div class="price"><span>ویرایش دستی، آمار و ارسال همگانی</span><b>رایگان</b></div>
      <p class="muted" style="margin-top:8px">هزینه به‌اندازه‌ی کار واقعیِ هوش مصنوعی حساب می‌شه؛ اگه ساخت ناموفق باشه چیزی کم نمی‌شه.</p>
      ${w.support ? `<button class="ghost" data-w="support" style="margin-top:10px">💳 خرید توکن بیشتر</button>` : ""}
    </div>
    <div class="card"><h2>🧾 تاریخچه</h2><div id="ledger"><p class="muted">در حال بارگذاری…</p></div></div>`;
  api("/api/ledger").then(d => {
    const el = $("#ledger"); if(!el) return;
    el.innerHTML = d.items.length ? d.items.map(x => `<div class="led"><div>${WHY[x.why] || x.why}<small>${esc(x.note)} · ${new Date(x.t).toLocaleDateString("fa-IR", {month:"short", day:"numeric"})}</small></div>
      <b class="${x.d > 0 ? "p" : "m"}">${x.d > 0 ? "+" : "−"}${fa(Math.abs(x.d))}</b></div>`).join("") : '<p class="muted">هنوز تراکنشی نداری.</p>';
  }).catch(() => {});
}
document.addEventListener("click", e => {
  const x = e.target.closest("[data-w]"); if(!x) return;
  const a = x.dataset.w, w = S.w;
  if(a === "copylink"){ navigator.clipboard?.writeText(w.ref_link).then(() => toast("لینک دعوت کپی شد ✅"), () => toast(w.ref_link)); return; }
  if(a === "share"){
    const u = "https://t.me/share/url?url=" + encodeURIComponent(w.ref_link) + "&text=" + encodeURIComponent("با هوش مصنوعی ربات تلگرام بساز 🤖 با لینک من وارد شو و توکن رایگان بگیر");
    return tg?.openTelegramLink ? tg.openTelegramLink(u) : window.open(u, "_blank");
  }
  if(a === "support"){ const u = "https://t.me/" + w.support; return tg?.openTelegramLink ? tg.openTelegramLink(u) : window.open(u, "_blank"); }
  const done = d => { S.w = d.wallet; renderWallet(); syncChip(); tg?.HapticFeedback?.notificationOccurred("success"); };
  if(a === "bonus") busy(x, async () => { const d = await api("/api/bonus", "POST"); done(d); toast(`🎁 ${fa(d.amount)} توکن گرفتی · روز ${fa(d.streak)} پشت‌سرهم`); });
  else if(a === "slot") busy(x, async () => { done(await api("/api/slot", "POST")); toast("اسلات جدید اضافه شد 🔓"); });
  else if(a === "redeem"){
    const c = $("#code").value.trim(); if(!c) return toast("کد رو وارد کن");
    busy(x, async () => { const d = await api("/api/redeem", "POST", {code: c}); done(d); toast(`🎟 ${fa(d.gained)} توکن اضافه شد`); });
  }
});
function syncChip(){ if(S.w) $("#quota").textContent = `🪙 ${fa(S.w.tokens)} توکن`; }
$("#quota").onclick = () => go("wallet");

/* ───────── پروفایل کاربر ───────── */
const pips = (n, total) => `<div class="pips">${Array.from({length: Math.max(total,1)}, (_,i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>`;
function renderProfile(){
  const u = tg?.initDataUnsafe?.user || {}, w = S.w;
  const name = [u.first_name, u.last_name].filter(Boolean).join(" ") || "کاربر";
  const active = S.bots.filter(b => b.active).length;
  const joined = w.joined ? new Date(w.joined).toLocaleDateString("fa-IR", {year:"numeric", month:"long", day:"numeric"}) : "—";
  $("#app").innerHTML = `
    <div class="card pf">
      <div class="av"><span class="ring"></span>
        <div class="img">${esc(name.trim().charAt(0))}${u.photo_url ? `<img src="${esc(u.photo_url)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</div></div>
      <h2>${esc(name)}</h2>
      ${u.username ? `<span class="muted un">@${esc(u.username)}</span>` : ""}
    </div>
    <div class="stats">
      <div class="stat"><div class="k">ربات‌های من</div><div class="v">${fa(S.bots.length)} <small>از ${fa(w.slots)}</small></div>${pips(S.bots.length, w.slots)}</div>
      <div class="stat"><div class="k">ربات‌های فعال</div><div class="v">${fa(active)} <small>از ${fa(S.bots.length)}</small></div>${pips(active, S.bots.length || w.slots)}</div>
      <div class="stat"><div class="k">موجودی توکن</div><div class="v">${fa(w.tokens)}</div></div>
      <div class="stat"><div class="k">توکن مصرف‌شده</div><div class="v">${fa(w.spent)}</div></div>
      <div class="stat"><div class="k">دعوت‌های موفق</div><div class="v">${fa(w.refs)}</div></div>
      <div class="stat"><div class="k">درآمد از دعوت</div><div class="v">${fa(w.ref_earned)} <small>توکن</small></div></div>
    </div>
    <div class="card kv">
      <div><span>شناسه‌ی تلگرام</span>${u.id ? `<b class="cpy" data-pf="copyid" data-id="${u.id}">${u.id}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg></b>` : "<b>—</b>"}</div>
      <div><span>اولین ورود</span><b>${joined}</b></div>
    </div>`;
}
document.addEventListener("click", e => {
  const c = e.target.closest('[data-pf="copyid"]'); if(!c) return;
  navigator.clipboard?.writeText(c.dataset.id).then(() => toast("شناسه کپی شد ✅"), () => toast(c.dataset.id));
});

/* ───────── نوار پایین ───────── */
const dock = $("#dock");
let dockOpen = true;
try{ dockOpen = localStorage.getItem("dockOpen") !== "0"; }catch(_){}
function setDock(o, save = true){
  dockOpen = o; dock.classList.toggle("closed", !o); document.body.classList.toggle("dock-closed", !o);
  $("#dockTab").setAttribute("aria-expanded", o);
  if(save) try{ localStorage.setItem("dockOpen", o ? "1" : "0"); }catch(_){}
}
function syncDock(){
  document.querySelectorAll(".dn").forEach(el => el.classList.toggle("on", el.dataset.d === (S.view === "profile" ? "profile" : S.view === "wallet" ? "wallet" : "bots")));
}
function go(where){
  if(S.busy) return toast("صبر کن کار فعلی تموم شه");
  closeSheet();
  if(where === "profile"){ if(S.view !== "profile"){ S.view = "profile"; S.cur = null; load(); } }
  else if(where === "wallet"){ if(S.view !== "wallet"){ S.view = "wallet"; S.cur = null; S.open = new Set(); render(); } load(); }
  else if(S.view !== "list"){ S.view = "list"; S.cur = null; S.open = new Set(); load(); }
  scrollTo({top:0, behavior:"smooth"});
  tg?.HapticFeedback?.selectionChanged();
}
let py = null;
dock.addEventListener("pointerdown", e => { py = e.clientY; });
dock.addEventListener("pointercancel", () => { py = null; });
dock.addEventListener("pointerup", e => {
  if(py === null) return;
  const dy = e.clientY - py; py = null;
  if(dy > 24) setDock(false); else if(dy < -24) setDock(true);
  else if(e.target.closest("#dockTab")) setDock(!dockOpen);
});
dock.addEventListener("click", e => { const n = e.target.closest("[data-d]"); if(n) go(n.dataset.d); });
document.addEventListener("focusin", e => { if(e.target.matches?.("input,textarea,select")) dock.classList.add("hide"); });
document.addEventListener("focusout", () => setTimeout(() => {
  if(!document.activeElement?.matches?.("input,textarea,select")) dock.classList.remove("hide");
}, 150));
setDock(dockOpen, false);

load();
</script>
</body>
</html>
