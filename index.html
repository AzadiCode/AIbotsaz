<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>رباتساز هوشمند</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#7a828a);
  --ac:var(--tg-theme-button-color,#2f7cf6);
  --act:var(--tg-theme-button-text-color,#fff);
  --red:#e5484d; --green:#2fa36b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;background:var(--bg2);color:var(--tx);
  font-size:15px;line-height:1.7;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px}
.top h1{font-size:18px;font-weight:700}
.chip{font-size:12px;background:var(--bg);color:var(--hint);padding:3px 11px;border-radius:99px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:8px}
.muted{color:var(--hint);font-size:13px}
button{font:inherit;border:0;border-radius:11px;padding:11px 16px;cursor:pointer;background:var(--ac);color:var(--act);width:100%}
button.ghost{background:var(--bg2);color:var(--tx)}
button.danger{background:transparent;color:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
textarea,input{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 12px;outline:none;resize:none}
textarea{min-height:110px}
input{direction:ltr;text-align:left}
.bot{display:flex;align-items:center;gap:10px;cursor:pointer}
.bot b{display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hint);flex:none}
.dot.on{background:var(--green)}
.back{background:none;color:var(--ac);width:auto;padding:8px 2px;margin-bottom:2px}
.node{border-top:1px solid var(--bg2);padding:10px 0}
.node:first-of-type{border-top:0}
.node .id{font-size:12px;color:var(--hint);direction:ltr;text-align:right}
.node .tx{white-space:pre-wrap;margin:2px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;background:var(--bg2);border-radius:8px;padding:3px 10px}
.empty{text-align:center;padding:26px 8px}
.empty p{margin-bottom:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;
  border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.think{display:flex;gap:8px;background:linear-gradient(135deg,rgba(47,124,246,.09),rgba(47,124,246,.03));
  border:1px solid rgba(47,124,246,.16);border-radius:12px;padding:10px 12px;margin:-2px 0 12px;
  font-size:12.5px;line-height:1.65;color:var(--tx);opacity:0;max-height:0;overflow:hidden;
  transition:opacity .35s ease,max-height .35s ease,margin .35s ease,padding .35s ease}
.think.show{opacity:1;max-height:700px;margin:0 0 12px}
.think .ic{flex:none;font-size:14px;line-height:1.5}
.think .tt{color:var(--hint)}

/* ── انیمیشن «در حال فکر کردن» ── */
.live{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px;
  border:1px solid rgba(47,124,246,.18);position:relative;overflow:hidden;animation:pop .3s ease}
.live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(47,124,246,.09) 50%,transparent 70%);
  transform:translateX(-100%);animation:sh 2s ease-in-out infinite}
.orb{width:36px;height:36px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from 0deg,var(--ac),#9b6bff,#34c3ff,var(--ac));animation:s 1.3s linear infinite}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.live .lt b{display:block;font-size:14px}
.live .lt b i{display:inline-block;font-style:normal;animation:bn 1.2s infinite}
.live .lt b i:nth-child(2){animation-delay:.15s}.live .lt b i:nth-child(3){animation-delay:.3s}
.live .ph{font-size:12.5px;color:var(--hint);transition:opacity .3s}
.live .ph.out{opacity:0}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.orb{animation-duration:3s}.live::after,.live .lt b i{animation:none}}

/* ── ویرایشگر ── */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hd h2{margin:0}
button.sm{width:auto;padding:5px 11px;font-size:12.5px;border-radius:9px}
button.x{background:transparent;color:var(--red);padding:5px 9px}
.lbl{display:block;font-size:12.5px;color:var(--hint);margin:10px 0 4px}
input.fa,textarea.fa{direction:rtl;text-align:right}
input[type=checkbox]{width:auto;flex:none;margin:0}
select{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:10px 10px;outline:none;min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.nid{font-size:12px;color:var(--hint);direction:ltr}
.tag{font-size:11px;background:var(--bg2);border-radius:6px;padding:1px 7px;margin-inline-start:6px;color:var(--hint)}
.rowbox{border:1px dashed var(--bg2);border-radius:11px;padding:8px;margin-top:8px}
.rowbox .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bt{background:var(--bg2);border-radius:10px;padding:8px;margin-bottom:6px}
.bt input,.bt select{background:var(--bg)}
.bt .l1{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.bt .l2{display:flex;gap:6px}.bt .l2>*{flex:1}.bt .l2>select:first-child{flex:0 0 42%}
.cmd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cmd input{flex:0 0 36%}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg2) 28%)}
.bar button{flex:1}
</style>
</head>
<body>
<div class="top"><h1>🤖 رباتساز هوشمند</h1><span class="chip" id="quota"></span></div>
<div id="app"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const INIT = tg?.initData || "";
// خالی = همون دامنه‌ای که این صفحه ازش لود شده (حالت پیش‌فرض). فقط اگه index.html رو جدا هاست کردی آدرس بک‌اند رو بذار:
const API_BASE = "";
let S = { bots: [], quota: 0, limit: 0, maxBots: 3, view: "list", cur: null, busy: false, edit: null, dirty: false, fresh: false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),2800); }

async function api(path, method="GET", body){
  const r = await fetch(API_BASE + path, { method, headers: {"Content-Type":"application/json","X-Init-Data":INIT}, body: body?JSON.stringify(body):undefined });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "خطا در ارتباط با سرور");
  return d;
}

async function load(){
  try{
    const d = await api("/api/me");
    S.bots = d.bots; S.quota = d.quota; S.limit = d.limit; S.maxBots = d.max_bots;
  }catch(e){ $("#app").innerHTML = `<div class="card empty"><p>این برنامه فقط داخل تلگرام کار می‌کنه.<br><span class="muted">از ربات مادر دکمه‌ی «ساخت ربات» رو بزن.</span></p></div>`; return; }
  render();
}

function render(){
  $("#quota").textContent = `سهمیه‌ی امروز: ${S.quota} از ${S.limit}`;
  S.view === "list" ? renderList() : (S.edit ? renderEditor() : renderBot());
}

function renderList(){
  const list = S.bots.map(b => `
    <div class="card bot" data-id="${b.id}">
      <span class="dot ${b.active?"on":""}"></span>
      <div><b>${esc(b.name)}</b><span class="muted">${b.active ? "@"+esc(b.username) : "هنوز فعال نشده"}</span></div>
    </div>`).join("");
  $("#app").innerHTML = (list || `<div class="card empty"><p>هنوز رباتی نساختی.<br><span class="muted">یه جمله بنویس، ربات آماده می‌شه.</span></p></div>`)
    + (S.bots.length < S.maxBots ? `<button id="new">＋ ساخت ربات جدید</button>` : `<p class="muted" style="text-align:center">به سقف ${S.maxBots} ربات رسیدی</p>`);
  document.querySelectorAll(".bot").forEach(el => el.onclick = () => { S.cur = S.bots.find(b=>b.id===el.dataset.id); S.edit=null; S.view="bot"; render(); });
  $("#new")?.addEventListener("click", () => { S.cur = null; S.view = "bot"; render(); });
}

const btnInfo = b => {
  if(b.goto) return "← " + esc(b.goto);
  const m = CH_RE.exec(b.url || "");
  return m ? "📢 @" + esc(m[1]) : "🔗";
};
function nodesHtml(cfg){
  return Object.entries(cfg.nodes).map(([id,n]) => `
    <div class="node">
      <div class="id">${esc(id)}${id===cfg.start?" · start":""}${n.ask?" · ask":""}</div>
      <div class="tx">${esc(n.text)}</div>
      <div class="btns">${n.buttons.flat().map(b=>`<span class="btn">${esc(b.text)} ${btnInfo(b)}</span>`).join("")}</div>
    </div>`).join("");
}

function renderBot(){
  const b = S.cur;
  const prompt = `
    <div class="card">
      <h2>${b ? "چی رو تغییر بدم؟" : "چه رباتی می‌خوای؟"}</h2>
      <textarea id="prompt" maxlength="1200" placeholder="${b ? "مثلاً: یه دکمه‌ی پشتیبانی اضافه کن" : "مثلاً: ربات فروشگاه لوازم جانبی موبایل با منوی محصولات و دکمه‌ی سفارش"}"></textarea>
      <div style="height:10px"></div>
      <button id="gen">${b ? "ارتقا بده" : "بساز"}</button>
    </div>
    <div id="live"></div>`;
  let body = "";
  if(b){
    body += `<div class="think${b.thinking?" show":""}" id="think"><span class="ic">✨</span><span class="tt">${S.fresh ? "" : esc(b.thinking||"")}</span></div>`;
    body += `<div class="card"><div class="hd"><h2>پیش‌نمایش ربات</h2><button class="sm ghost" id="edit">✏️ ویرایش دستی</button></div>${nodesHtml(b.config)}</div>`;
    if(b.versions) body += `<button class="ghost" id="undo" style="margin-bottom:12px">↩ برگشت به نسخه‌ی قبلی</button>`;
    body += b.active
      ? `<div class="card"><h2>🟢 فعاله: @${esc(b.username)}</h2><p class="muted" style="margin-bottom:10px">تغییرات بلافاصله روی ربات اعمال می‌شن. برای دریافت پیام‌های کاربرها، یک بار ربات خودت رو استارت کن.</p><button class="ghost" id="off">غیرفعال کردن</button></div>`
      : `<div class="card"><h2>فعال‌سازی</h2><p class="muted" style="margin-bottom:10px">ربات رو از @BotFather بساز و توکنش رو اینجا بذار.</p><input id="token" placeholder="123456:ABC..." autocomplete="off"><div style="height:10px"></div><button id="act">فعال کن</button></div>`;
    body += `<button class="danger" id="del">حذف ربات</button>`;
  }
  $("#app").innerHTML = `<button class="back" id="back">← بازگشت</button>${prompt}${body}`;
  $("#back").onclick = () => { S.view="list"; S.cur=null; S.edit=null; load(); };
  $("#gen").onclick = generate;
  $("#edit")?.addEventListener("click", startEdit);
  $("#undo")?.addEventListener("click", undo);
  $("#act")?.addEventListener("click", activate);
  $("#off")?.addEventListener("click", () => act("deactivate", "ربات غیرفعال شد"));
  $("#del")?.addEventListener("click", remove);
  if(S.fresh && b?.thinking){ typeText($("#think .tt"), b.thinking); $("#think").scrollIntoView({behavior:"smooth",block:"nearest"}); }
  S.fresh = false;
}

/* ───────── تایپ تدریجی توضیح هوش مصنوعی ───────── */
function typeText(el, text){
  const id = ++typeText.id;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent = text; return; }
  let i = 0; el.textContent = "";
  (function step(){
    if(id !== typeText.id || !el.isConnected) return;
    i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i);
    if(i < text.length) setTimeout(step, 16);
  })();
}
typeText.id = 0;

/* ───────── انیمیشن «در حال فکر کردن» ───────── */
const PHASES = ["دارم درخواستت رو می‌خونم…","ببینم ربات واقعاً به چی نیاز داره…","مسیر کاربرها رو طراحی می‌کنم…",
  "بخش‌ها و دکمه‌ها رو می‌چینم…","متن‌ها رو می‌نویسم…","یه بررسی نهایی می‌کنم…"];
function startLive(){
  const box = $("#live"); if(!box) return;
  box.innerHTML = `<div class="live"><div class="orb"></div><div class="lt"><b>در حال فکر کردن<i>.</i><i>.</i><i>.</i></b><span class="ph" id="ph">${PHASES[0]}</span></div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"center"});
  let i = 0; clearInterval(startLive.t);
  startLive.t = setInterval(() => {
    const ph = $("#ph"); if(!ph) return clearInterval(startLive.t);
    ph.classList.add("out");
    setTimeout(() => { i = Math.min(i + 1, PHASES.length - 1); ph.textContent = PHASES[i]; ph.classList.remove("out"); }, 300);
  }, 2600);
}
function stopLive(){ clearInterval(startLive.t); const box = $("#live"); if(box) box.innerHTML = ""; }

/* ───────── ویرایش دستی ───────── */
const cp = o => JSON.parse(JSON.stringify(o));
const CH_RE = /^https:\/\/t\.me\/([A-Za-z][A-Za-z0-9_]{4,31})\/?$/;
const NAME_RE = /^@?([A-Za-z][A-Za-z0-9_]{4,31})$/;

function startEdit(){
  const c = cp(S.cur.config);
  for(const n of Object.values(c.nodes)){
    n.buttons = (n.buttons||[]).map(row => row.map(b => {
      if(b.goto) return {text:b.text, kind:"goto", goto:b.goto, val:""};
      const m = CH_RE.exec(b.url||"");
      return m ? {text:b.text, kind:"channel", goto:"", val:"@"+m[1]} : {text:b.text, kind:"url", goto:"", val:b.url||""};
    }));
  }
  c.cmds = Object.entries(c.commands||{}); delete c.commands;
  S.edit = c; S.dirty = false; renderEditor(); scrollTo(0,0);
}

function buildCfg(){
  const c = S.edit, nodes = {}, commands = {};
  for(const [id,n] of Object.entries(c.nodes)){
    nodes[id] = { text:n.text.trim(), ask:!!n.ask,
      buttons:n.buttons.map(row => row.map(b => b.kind==="goto" ? {text:b.text.trim(), goto:b.goto} : {text:b.text.trim(), url:b.val.trim()})) };
  }
  c.cmds.forEach(([k,v]) => { k = k.trim().replace(/^\//,"").toLowerCase(); if(k) commands[k] = v; });
  return { name:c.name.trim() || "ربات من", start:c.start, fallback:c.fallback, commands, nodes };
}

function renderEditor(){
  const c = S.edit, ids = Object.keys(c.nodes);
  const title = id => `${id} · ${(c.nodes[id].text||"").replace(/\s+/g," ").slice(0,22)}`;
  const sel = (cur, attrs) => `<select ${attrs}>${ids.map(i=>`<option value="${esc(i)}"${i===cur?" selected":""}>${esc(title(i))}</option>`).join("")}</select>`;

  const nodesH = ids.map(id => {
    const n = c.nodes[id];
    const rows = n.buttons.map((row,r) => `
      <div class="rowbox">
        <div class="rh"><span class="muted">ردیف ${r+1}</span>${row.length<3?`<button class="sm ghost" data-a="addbtn" data-n="${id}" data-r="${r}">＋ دکمه کنار این</button>`:""}</div>
        ${row.map((b,i) => { const at = `data-n="${id}" data-r="${r}" data-b="${i}"`; return `
          <div class="bt">
            <div class="l1">
              <input class="fa" data-f="btext" ${at} value="${esc(b.text)}" placeholder="متن دکمه" maxlength="40">
              <button class="sm x" data-a="delbtn" ${at}>✕</button>
            </div>
            <div class="l2">
              <select data-f="bkind" ${at}>
                <option value="goto"${b.kind==="goto"?" selected":""}>↩ رفتن به بخش</option>
                <option value="channel"${b.kind==="channel"?" selected":""}>📢 کانال/گروه</option>
                <option value="url"${b.kind==="url"?" selected":""}>🔗 لینک</option>
              </select>
              ${b.kind==="goto" ? sel(b.goto, `data-f="bgoto" ${at}`)
                : `<input data-f="bval" ${at} value="${esc(b.val)}" placeholder="${b.kind==="channel"?"@channel_id":"https://..."}" autocomplete="off">`}
            </div>
          </div>`; }).join("")}
      </div>`).join("");
    return `
      <div class="card" id="node-${id}">
        <div class="hd"><div><b class="nid">${esc(id)}</b>${id===c.start?'<span class="tag">شروع</span>':""}${id===c.fallback?'<span class="tag">ناشناس</span>':""}</div>
          ${id===c.start||id===c.fallback?"":`<button class="sm x" data-a="delnode" data-n="${id}">🗑 حذف بخش</button>`}</div>
        <span class="lbl">متن پیام</span>
        <textarea class="fa" data-f="ntext" data-n="${id}" maxlength="3500">${esc(n.text)}</textarea>
        <label class="chk"><input type="checkbox" data-f="ask" data-n="${id}"${n.ask?" checked":""}> پیام بعدی کاربر برای من (صاحب ربات) ارسال بشه</label>
        <span class="lbl">دکمه‌ها</span>
        ${rows || '<p class="muted">دکمه‌ای نداره.</p>'}
        ${n.buttons.length<6?`<button class="sm ghost" style="margin-top:8px" data-a="addrow" data-n="${id}">＋ ردیف دکمه‌ی جدید</button>`:""}
      </div>`;
  }).join("");

  const cmdsH = c.cmds.map(([k,v],i) => `
    <div class="cmd"><span>/</span><input data-f="cmdname" data-i="${i}" value="${esc(k)}" placeholder="help" maxlength="30" autocomplete="off">
      ${sel(v, `data-f="cmdnode" data-i="${i}"`)}<button class="sm x" data-a="delcmd" data-i="${i}">✕</button></div>`).join("");

  $("#app").innerHTML = `
    <button class="back" id="back">← انصراف و بازگشت</button>
    <div class="card"><h2>✏️ ویرایش دستی</h2><p class="muted">همه‌چی قابل تغییره: متن‌ها، دکمه‌ها، آیدی کانال، لینک‌ها. ویرایش دستی سهمیه‌ی روزانه مصرف نمی‌کنه.</p>
      <span class="lbl">نام ربات</span><input class="fa" data-f="name" value="${esc(c.name)}" maxlength="50">
      <span class="lbl">بخشی که با /start نشون داده می‌شه</span>${sel(c.start, 'data-f="start"')}
      <span class="lbl">بخشی که برای پیام‌های نامفهوم نشون داده می‌شه</span>${sel(c.fallback, 'data-f="fallback"')}
    </div>
    <div class="card"><div class="hd"><h2>دستورها (مثل /help)</h2><button class="sm ghost" data-a="addcmd">＋ دستور</button></div>
      ${cmdsH || '<p class="muted">دستور اضافه‌ای نداری.</p>'}</div>
    ${nodesH}
    ${ids.length<25?'<button class="ghost" data-a="addnode" style="margin-bottom:12px">＋ بخش جدید</button>':""}
    <div class="bar"><button id="save">💾 ذخیره تغییرات</button><button class="ghost" id="cancel">انصراف</button></div>`;
  $("#back").onclick = $("#cancel").onclick = cancelEdit;
  $("#save").onclick = saveEdit;
}

function rerenderEditor(scrollToId){
  const y = scrollY; renderEditor();
  if(scrollToId){ document.getElementById("node-"+scrollToId)?.scrollIntoView({behavior:"smooth",block:"center"}); } else scrollTo(0,y);
}
function cancelEdit(){
  const go = ok => { if(!ok) return; S.edit = null; S.dirty = false; renderBot(); };
  if(!S.dirty) return go(true);
  tg?.showConfirm ? tg.showConfirm("تغییرات ذخیره نشده از بین می‌رن. ادامه می‌دی؟", go) : go(confirm("تغییرات ذخیره نشده از بین می‌رن. ادامه می‌دی؟"));
}
function saveEdit(){
  busy($("#save"), async () => {
    const d = await api(`/api/bots/${S.cur.id}/config`, "PUT", {config: buildCfg()});
    S.cur = d.bot; S.edit = null; S.dirty = false; render(); toast("تغییرات ذخیره شد ✅");
    tg?.HapticFeedback?.notificationOccurred("success");
  });
}
const newBtn = c => ({text:"دکمه‌ی جدید", kind:"goto", goto:c.start, val:""});

document.addEventListener("input", e => {
  if(!S.edit) return;
  const t = e.target, f = t.dataset.f; if(!f) return;
  const c = S.edit, n = c.nodes[t.dataset.n], bt = n && t.dataset.r !== undefined ? n.buttons[+t.dataset.r]?.[+t.dataset.b] : null;
  if(f==="name") c.name = t.value;
  else if(f==="ntext") n.text = t.value;
  else if(f==="btext") bt.text = t.value;
  else if(f==="bval") bt.val = t.value;
  else if(f==="cmdname") c.cmds[+t.dataset.i][0] = t.value;
  else return;
  S.dirty = true;
});
document.addEventListener("change", e => {
  if(!S.edit) return;
  const t = e.target, f = t.dataset.f; if(!f) return;
  const c = S.edit, n = c.nodes[t.dataset.n], bt = n && t.dataset.r !== undefined ? n.buttons[+t.dataset.r]?.[+t.dataset.b] : null;
  S.dirty = true;
  if(f==="start"||f==="fallback") c[f] = t.value;
  else if(f==="cmdnode") c.cmds[+t.dataset.i][1] = t.value;
  else if(f==="ask") n.ask = t.checked;
  else if(f==="bgoto") bt.goto = t.value;
  else if(f==="bkind"){
    const k = t.value;
    if(k==="goto") bt.goto = bt.goto || c.start;
    else if(k==="channel"){ const m = CH_RE.exec(bt.val) || NAME_RE.exec(bt.val); bt.val = m ? "@"+m[1] : ""; }
    else if(NAME_RE.test(bt.val)) bt.val = "https://t.me/" + bt.val.replace("@","");
    bt.kind = k; rerenderEditor();
  }
});
document.addEventListener("click", e => {
  if(!S.edit) return;
  const el = e.target.closest("[data-a]"); if(!el) return;
  const c = S.edit, a = el.dataset.a, id = el.dataset.n, r = +el.dataset.r, i = +el.dataset.i, bi = +el.dataset.b;
  S.dirty = true;
  if(a==="addnode"){
    if(Object.keys(c.nodes).length >= 25) return toast("حداکثر ۲۵ بخش");
    let k = Object.keys(c.nodes).length + 1; while(c.nodes["page_"+k]) k++;
    c.nodes["page_"+k] = {text:"متن این بخش رو بنویس", ask:false, buttons:[[{text:"🏠 منوی اصلی", kind:"goto", goto:c.start, val:""}]]};
    return rerenderEditor("page_"+k);
  }
  if(a==="delnode"){
    delete c.nodes[id];
    for(const n of Object.values(c.nodes)) n.buttons = n.buttons.map(row => row.filter(b => !(b.kind==="goto" && b.goto===id))).filter(row => row.length);
    c.cmds = c.cmds.filter(([,v]) => v !== id);
    toast("بخش و دکمه‌های وصل به اون حذف شد");
  }
  else if(a==="addrow"){ if(c.nodes[id].buttons.length < 6) c.nodes[id].buttons.push([newBtn(c)]); }
  else if(a==="addbtn"){ const row = c.nodes[id].buttons[r]; if(row.length < 3) row.push(newBtn(c)); }
  else if(a==="delbtn"){ const bs = c.nodes[id].buttons; bs[r].splice(bi,1); if(!bs[r].length) bs.splice(r,1); }
  else if(a==="addcmd"){ if(c.cmds.length < 10) c.cmds.push(["help", c.start]); else return toast("حداکثر ۱۰ دستور"); }
  else if(a==="delcmd"){ c.cmds.splice(i,1); }
  else return;
  rerenderEditor();
});

async function busy(btn, fn){
  if(S.busy) return; S.busy = true;
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = old + '<span class="spin"></span>';
  try{ await fn(); }catch(e){ toast(e.message); }
  S.busy = false; if(btn.isConnected){ btn.disabled = false; btn.innerHTML = old; }
}

function generate(){
  const btn = $("#gen"), ta = $("#prompt"), p = ta.value.trim();
  if(p.length < 5) return toast("توضیح بیشتری بنویس");
  busy(btn, async () => {
    ta.readOnly = true; startLive();
    try{
      const d = await api("/api/generate","POST",{ prompt:p, bot_id:S.cur?.id });
      const wasActive = S.cur?.active;
      S.cur = d.bot; S.quota = d.quota; S.fresh = true; stopLive(); render();
      toast(wasActive ? "ربات ارتقا پیدا کرد ✅" : "ربات ساخته شد ✅");
      tg?.HapticFeedback?.notificationOccurred("success");
    } finally { stopLive(); ta.readOnly = false; }
  });
}
function undo(){ busy($("#undo"), async () => { const d = await api(`/api/bots/${S.cur.id}/undo`,"POST"); S.cur = d.bot; render(); toast("برگشت داده شد"); }); }
function activate(){
  const t = $("#token").value.trim(); if(!t) return toast("توکن رو وارد کن");
  busy($("#act"), async () => { const d = await api(`/api/bots/${S.cur.id}/activate`,"POST",{token:t}); S.cur = d.bot; render(); toast("ربات فعال شد 🎉"); });
}
function act(action, msg){ busy($("#off"), async () => { const d = await api(`/api/bots/${S.cur.id}/${action}`,"POST"); S.cur = d.bot; render(); toast(msg); }); }
function remove(){
  const go = async ok => { if(!ok) return; await api(`/api/bots/${S.cur.id}`,"DELETE"); S.view="list"; S.cur=null; load(); toast("حذف شد"); };
  tg?.showConfirm ? tg.showConfirm("این ربات برای همیشه حذف بشه؟", go) : go(confirm("حذف بشه؟"));
}

load();
</script>
</body>
</html>
