<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>رباتساز هوشمند</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#7a828a);
  --ac:var(--tg-theme-button-color,#2f7cf6);
  --act:var(--tg-theme-button-text-color,#fff);
  --red:#e5484d; --green:#2fa36b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;background:var(--bg2);color:var(--tx);
  font-size:15px;line-height:1.7;padding:0 14px calc(var(--dockh,84px) + 18px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px}
.top h1{font-size:18px;font-weight:700}
.chip{font-size:12px;background:var(--bg);color:var(--hint);padding:3px 11px;border-radius:99px}
.card{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin-bottom:8px}
.muted{color:var(--hint);font-size:13px}
button{font:inherit;border:0;border-radius:11px;padding:11px 16px;cursor:pointer;background:var(--ac);color:var(--act);width:100%}
button.ghost{background:var(--bg2);color:var(--tx)}
button.danger{background:transparent;color:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1}
textarea,input{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 12px;outline:none;resize:none}
textarea{min-height:110px}
input{direction:ltr;text-align:left}
.bot{display:flex;align-items:center;gap:10px;cursor:pointer}
.bot b{display:block}
.dot{width:9px;height:9px;border-radius:50%;background:var(--hint);flex:none}
.dot.on{background:var(--green)}
.back{background:none;color:var(--ac);width:auto;padding:8px 2px;margin-bottom:2px}
.node{border-top:1px solid var(--bg2);padding:10px 0}
.node:first-of-type{border-top:0}
.node .id{font-size:12px;color:var(--hint);direction:ltr;text-align:right}
.node .tx{white-space:pre-wrap;margin:2px 0 6px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{font-size:12.5px;background:var(--bg2);border-radius:8px;padding:3px 10px}
.empty{text-align:center;padding:26px 8px}
.empty p{margin-bottom:14px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;
  border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-left:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.think{display:flex;gap:8px;background:linear-gradient(135deg,rgba(14,165,160,.09),rgba(14,165,160,.03));
  border:1px solid rgba(14,165,160,.16);border-radius:11px;padding:8px 11px;margin:-2px 0 12px;
  font-size:12px;line-height:1.6;color:var(--tx);opacity:0;max-height:0;overflow:hidden;
  transition:opacity .35s ease,max-height .35s ease,margin .35s ease,padding .35s ease}
.think.show{opacity:1;max-height:700px;margin:0 0 12px}
.think .thi{flex:none;font-size:14px;line-height:1.5}
.think .tt{color:var(--hint)}

/* ── انیمیشن «در حال فکر کردن» ── */
.live{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:14px;margin-bottom:12px;
  border:1px solid rgba(14,165,160,.18);position:relative;overflow:hidden;animation:pop .3s ease}
.live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(14,165,160,.09) 50%,transparent 70%);
  transform:translateX(-100%);animation:sh 2s ease-in-out infinite}
.orb{width:36px;height:36px;border-radius:50%;flex:none;position:relative;
  background:conic-gradient(from 0deg,var(--ac),#9b6bff,#34c3ff,var(--ac));animation:s 1.3s linear infinite}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.live .lt b{display:block;font-size:14px}
.live .lt b i{display:inline-block;font-style:normal;animation:bn 1.2s infinite}
.live .lt b i:nth-child(2){animation-delay:.15s}.live .lt b i:nth-child(3){animation-delay:.3s}
.live .ph{font-size:12.5px;color:var(--hint);transition:opacity .3s}
.live .ph.out{opacity:0}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.orb{animation-duration:3s}.live::after,.live .lt b i{animation:none}}

/* ── ویرایشگر ── */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hd h2{margin:0}
button.sm{width:auto;padding:5px 11px;font-size:12.5px;border-radius:9px}
button.x{background:transparent;color:var(--red);padding:5px 9px}
.lbl{display:block;font-size:12.5px;color:var(--hint);margin:12px 0 4px}
input.fa,textarea.fa{direction:rtl;text-align:right}
input[type=checkbox]{width:auto;flex:none;margin:0}
select{font:inherit;width:100%;background:var(--bg2);color:var(--tx);border:0;border-radius:11px;padding:11px 10px;outline:none;min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:12px}
.tag{font-size:11px;background:var(--bg2);border-radius:6px;padding:1px 8px;color:var(--hint)}
.bubble{position:relative;background:var(--bg2);border-radius:14px;padding:10px 12px 10px 34px;white-space:pre-wrap;cursor:pointer;
  border:1px solid transparent;transition:border-color .15s}
.bubble:active{border-color:var(--ac)}
.bubble .pen{position:absolute;left:10px;top:9px;font-size:13px;opacity:.55}
.krow{display:flex;gap:6px;margin-top:6px}
button.kb{flex:1;min-width:0;background:var(--bg2);color:var(--tx);padding:8px 6px;font-size:13.5px;border-radius:10px;
  border:1px solid rgba(127,127,127,.2);line-height:1.5}
button.kb:active{border-color:var(--ac)}
button.kb small{display:block;color:var(--hint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.kb.add{flex:0 0 40px;background:transparent;color:var(--ac);border:1px dashed var(--ac);font-size:15px}
button.kb.add.wide{display:block;width:100%;margin-top:6px;font-size:13px}
.cmd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cmd input{flex:1;min-width:0}.cmd .cmdn{flex:0 0 34%}
.bar{display:flex;gap:8px;margin-top:16px}
.bar button{flex:1}
button.danger-b{background:transparent;color:var(--red);border:1px solid rgba(229,72,77,.35)}
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.show{display:block}
.sb{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fi .2s}
.sp{position:absolute;bottom:0;left:0;right:0;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s ease;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fi{from{opacity:0}to{opacity:1}}
#toast{z-index:99}

/* ═════════ کارت‌های کشویی ═════════ */
.card.nd{padding:0;overflow:hidden}
.nd .nh{display:block;padding:13px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.nd .nr{display:flex;align-items:center;gap:10px}
.nd .nt{flex:1;min-width:0}
.nd .nt b{display:block;font-size:14px;line-height:1.5}
.nd .ns{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:20px;
  opacity:1;transition:opacity .2s,max-height .3s}
.nd.open .ns{opacity:0;max-height:0}
.nd .nm{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.nd .tag.cnt{background:rgba(14,165,160,.1);color:var(--ac)}
.nd .chev{width:18px;height:18px;flex:none;color:var(--hint);transition:transform .3s cubic-bezier(.2,.8,.2,1),color .2s}
.nd.open .chev{transform:rotate(180deg);color:var(--ac)}
.nbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.2,.8,.2,1)}
.nd.open .nbody{grid-template-rows:1fr}
.nbody>div{overflow:hidden;min-height:0}
.nbi{padding:2px 14px 14px;border-top:1px solid transparent;opacity:0;transform:translateY(-4px);transition:opacity .25s .05s,transform .3s .05s}
.nd.open .nbi{opacity:1;transform:none;border-top-color:var(--bg2)}
.nd .nbi{padding-top:12px}
.tray{background:rgba(127,127,127,.13);border-radius:12px;padding:6px 6px 7px;margin-top:10px}
.tray .krow{margin-top:5px}.tray .krow:first-child{margin-top:0}
.krow.rk button.kb{border:0;border-radius:6px;background:var(--bg);box-shadow:0 1px 0 rgba(127,127,127,.4)}
.pvhd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px}
.pvhd .muted{font-size:12.5px}
.pvhd button{white-space:nowrap;flex:none}
.rise{animation:riseIn .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes riseIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* انتخاب نوع دکمه‌ها */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 6px 6px;background:transparent;color:var(--hint);
  border:1px solid rgba(127,127,127,.26);border-radius:10px;line-height:1.4;transition:border-color .18s,background .18s,color .18s}
.seg button svg{width:38px;height:28px;margin-bottom:1px}
.seg button b{color:var(--tx);font-weight:600;font-size:12px}
.seg button small{font-size:10px}
.seg button.on{border-color:var(--ac);color:var(--ac);background:rgba(14,165,160,.06)}

/* ═════════ انیمیشن ساخت ═════════ */
.build{position:relative;background:var(--bg);border-radius:14px;padding:11px 13px 12px;margin-bottom:10px;overflow:hidden;
  border:1px solid rgba(14,165,160,.2);animation:pop .35s ease}
.build .bh{display:flex;align-items:center;gap:10px}
.build .bt{flex:1;min-width:0}
.build .bt b{display:block;font-size:13px;line-height:1.4}
.build .ph{display:block;font-size:11.5px;color:var(--hint);transition:opacity .3s,transform .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.build .ph.out{opacity:0;transform:translateY(3px)}
.build .clk{font-size:11px;color:var(--hint);direction:ltr;font-variant-numeric:tabular-nums;letter-spacing:.04em;
  background:var(--bg2);border-radius:99px;padding:1px 8px}
.core{width:34px;height:34px;flex:none;overflow:visible}
.core .glow{fill:var(--ac);opacity:.16;animation:glow 2.4s ease-in-out infinite;transform-origin:50% 50%}
.core .r1{fill:none;stroke:var(--ac);stroke-opacity:.4;stroke-width:1;stroke-dasharray:1.5 4.5;transform-origin:50% 50%;animation:s 16s linear infinite}
.core .arc{fill:none;stroke:url(#gA);stroke-width:2.2;stroke-linecap:round;transform-origin:50% 50%;animation:s 2.6s cubic-bezier(.5,0,.5,1) infinite}
.core .arc2{fill:none;stroke:#34c3ff;stroke-opacity:.7;stroke-width:1.4;stroke-linecap:round;transform-origin:50% 50%;animation:s 4.2s linear infinite reverse}
.core .orb1{fill:#9b6bff;transform-origin:50% 50%;animation:s 5s linear infinite}
.core .cpu{fill:url(#gA);transform-origin:50% 50%;animation:chip 3.6s ease-in-out infinite}
.core .eye{fill:var(--bg)}
@keyframes glow{50%{transform:scale(1.5);opacity:.05}}
@keyframes chip{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(90deg) scale(.86)}}
.bp{position:relative;display:flex;align-items:flex-start;gap:10px;margin:9px 0 9px;padding:8px 10px;border-radius:10px;background:var(--bg2);overflow:hidden}
.bp::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(127,127,127,.25) 1px,transparent 0);
  background-size:13px 13px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
.bp .msg{position:relative;flex:0 0 52%;background:var(--bg);border-radius:9px 9px 9px 3px;padding:7px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.bp .msg i{display:block;height:4px;border-radius:3px;background:rgba(127,127,127,.3);width:var(--w);transform-origin:100% 50%;animation:lineIn 4.8s ease-in-out infinite;animation-delay:calc(var(--k)*.18s)}
.bp .msg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(14,165,160,.12) 50%,transparent 70%);
  transform:translateX(100%);animation:sh2 2.2s ease-in-out infinite}
.bp .keys{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start}
.bp .keys b{height:15px;border-radius:6px;background:var(--bg);border:1px solid rgba(14,165,160,.35);opacity:0;
  animation:keyIn 4.8s ease-in-out infinite;animation-delay:calc(.9s + var(--k)*.22s)}
@keyframes lineIn{0%{transform:scaleX(0);opacity:0}14%{opacity:1}30%,86%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes keyIn{0%,6%{opacity:0;transform:translateY(5px) scale(.94)}20%,76%{opacity:1;transform:none}92%,100%{opacity:0}}
@keyframes sh2{to{transform:translateX(-100%)}}
.steps{display:flex}
.st{position:relative;flex:1;text-align:center;font-size:10.5px;color:var(--hint);line-height:1.4;transition:color .3s}
.st::before{content:"";position:absolute;top:4px;left:-50%;width:100%;height:2px;background:rgba(127,127,127,.22);transition:background .5s}
.st:last-child::before{display:none}
.st.done::before{background:var(--ac)}
.st i{position:relative;z-index:1;display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 4px;background:var(--bg);
  border:2px solid rgba(127,127,127,.35);transition:background .3s,border-color .3s}
.st.done i{background:var(--ac);border-color:var(--ac)}
.st.done i::after{content:"";position:absolute;left:1.8px;top:.1px;width:2px;height:4.4px;border:solid var(--act);border-width:0 1.4px 1.4px 0;transform:rotate(40deg)}
.st.cur{color:var(--tx)}
.st.cur i{border-color:var(--ac);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(14,165,160,.45)}100%{box-shadow:0 0 0 8px rgba(14,165,160,0)}}
.build .prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(127,127,127,.14);overflow:hidden}
.build .prog::after{content:"";position:absolute;left:0;top:0;bottom:0;width:38%;background:linear-gradient(90deg,transparent,var(--ac),#9b6bff,transparent);
  animation:slide 1.7s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(270%)}}
@media (prefers-reduced-motion:reduce){
  .core *,.bp .msg i,.bp .msg::after,.bp .keys b,.build .prog::after,.st.cur i,.rise{animation:none!important}
  .bp .keys b{opacity:1}.nbody,.nbi,.nd .chev{transition:none}
}

/* ═════════ نوار پایین (دوک) ═════════ */
body{--dockh:calc(84px + env(safe-area-inset-bottom))}
body.dock-closed{--dockh:calc(30px + env(safe-area-inset-bottom))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;touch-action:none;
  transition:transform .42s cubic-bezier(.3,.9,.25,1)}
.dock.closed{transform:translateY(100%)}
.dock.hide{transform:translateY(calc(100% + 40px))}
.dock .tab{position:absolute;left:50%;bottom:100%;width:76px;height:24px;margin:0 0 0 -38px;padding:0;border-radius:15px 15px 0 0;
  background:var(--bg);color:var(--hint);display:grid;place-items:center;box-shadow:0 -5px 14px rgba(0,0,0,.08)}
.dock .tab::before,.dock .tab::after{content:"";position:absolute;bottom:0;width:12px;height:12px}
.dock .tab::before{right:100%;border-bottom-right-radius:12px;box-shadow:6px 6px 0 6px var(--bg)}
.dock .tab::after{left:100%;border-bottom-left-radius:12px;box-shadow:-6px 6px 0 6px var(--bg)}
.dock .tab svg{width:20px;height:20px;transition:transform .4s cubic-bezier(.3,.9,.25,1)}
.dock.closed .tab svg{transform:rotate(180deg)}
.dock .tab i{position:absolute;top:5px;width:22px;height:3px;border-radius:2px;background:currentColor;opacity:.28}
.dpanel{display:flex;justify-content:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);box-shadow:0 -6px 22px rgba(0,0,0,.09)}
.dock .dn{width:auto;flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px 6px;
  background:transparent;color:var(--hint);font-size:11.5px;border-radius:14px;transition:color .2s,background .2s}
.dock .dn svg{width:22px;height:22px}
.dock .dn.on{color:var(--ac);background:rgba(14,165,160,.1)}
.dock .dn.on svg{filter:drop-shadow(0 0 5px rgba(14,165,160,.45))}
.dock button:focus-visible,.nd .nh:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#toast{bottom:calc(var(--dockh) + 12px);transition:opacity .2s,bottom .42s}

/* ═════════ پروفایل ═════════ */
.pf{position:relative;overflow:hidden;text-align:center;padding:24px 16px 18px;animation:pop .3s ease}
.pf::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(127,127,127,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(127,127,127,.12) 1px,transparent 1px);
  background-size:18px 18px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%)}
.pf>*{position:relative}
.av{position:relative;width:84px;height:84px;margin:0 auto 12px}
.av .ring{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--ac),#9b6bff,#34c3ff,var(--ac));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));
  animation:s 14s linear infinite}
.av .img{position:absolute;inset:0;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:32px;font-weight:700;color:var(--ac);overflow:hidden}
.av .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf h2{font-size:18px;margin:0}
.pf .un{direction:ltr;display:inline-block;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:14px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--hint)}
.stat .v{font-size:24px;font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:400;color:var(--hint)}
.pips{display:flex;gap:4px;margin-top:6px}
.pips i{flex:1;height:5px;border-radius:3px;background:rgba(127,127,127,.22)}
.pips i.on{background:linear-gradient(90deg,var(--ac),#9b6bff)}
.quota{display:flex;align-items:center;gap:14px;grid-column:1/-1}
.quota svg{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.quota circle{fill:none;stroke-width:5;stroke-linecap:round}
.quota .tr{stroke:rgba(127,127,127,.2)}
.quota .fg{stroke:url(#gQ);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.quota .qv{font-size:13.5px;line-height:1.7}
.quota .qv b{font-size:20px;font-variant-numeric:tabular-nums}
.kv{padding:4px 14px}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bg2);font-size:13.5px}
.kv div:first-child{border-top:0}
.kv span{color:var(--hint)}
.kv b{font-weight:500}
.kv .cpy{cursor:pointer;direction:ltr;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.kv .cpy svg{width:14px;height:14px;color:var(--hint)}
/* ═════════ ویرایشگر متغیر و شرط ═════════ */
.cmd select{flex:1;min-width:0}
details.adv{margin-top:14px;border:1px solid rgba(127,127,127,.22);border-radius:12px;padding:0 12px}
details.adv>summary{cursor:pointer;padding:10px 0;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::after{content:"＋";color:var(--hint)}
details.adv[open]>summary::after{content:"－"}
details.adv .box{padding:0 0 12px}
.sub{font-size:12.5px;font-weight:600;margin:12px 0 6px;display:flex;justify-content:space-between;align-items:center}
.rl{background:var(--bg2);border-radius:11px;padding:8px;margin-bottom:8px}
.rl .cmd{margin-bottom:6px}.rl .cmd:last-child{margin-bottom:0}
.rl input,.rl select,.rl textarea{padding:8px 9px;font-size:13px;border-radius:9px;background:var(--bg)}
.rl textarea{min-height:64px}
.rl>input{margin-top:0}
.rl .lbl{margin:6px 0 3px}
.kvr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--bg2);font-size:12.5px}
.kvr:first-of-type{border-top:0}
.kvr code{font-family:ui-monospace,Menlo,monospace;color:var(--ac);font-size:12px}
.kvr span{color:var(--hint)}
.wal{text-align:center}.wal .k{font-size:12px;color:var(--hint)}
.wal .big{font-size:34px;font-weight:800;line-height:1.5;font-variant-numeric:tabular-nums}
.tplg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
button.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;background:var(--bg);color:var(--tx);padding:12px;border-radius:14px}
button.tpl span{font-size:22px}button.tpl b{font-size:13.5px}button.tpl small{font-size:11.5px;color:var(--hint);line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sub{border-top:1px solid var(--bg2);padding:10px 0;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.sub:first-child{border-top:0}.sub small{display:block;color:var(--hint);font-size:11.5px}
.pos{color:var(--green)}.neg{color:var(--red)}

:root{--ac:#0ea5a0;--ac2:#6d5efc;--act:#fff;--green:#16a37f;--red:#e5484d;--r:12px;

function nodeCard(cfg, id, i = 0, rise = false){
  const n = cfg.nodes[id], tags = [], isRk = n.kb === "reply";
  if(id===cfg.start) tags.push("شروع");
  if(id===cfg.fallback) tags.push("پیام ناشناس");
  if(n.fields) tags.push("فرم");
  else if(n.ask) tags.push("دریافت پیام");
  if(isRk) tags.push("<i class='ic ic-keyboard'></i>کیبورد چت");
  if(n.media || n.photo) tags.push("<i class='ic ic-clip'></i>فایل");
  if(n.ai) tags.push("<i class='ic ic-bot'></i>هوش مصنوعی");
  if(n.do?.length || n.route?.length || n.alt?.length) tags.push("<i class='ic ic-puzzle'></i>منطق");
  const open = S.open.has(id), nb = n.buttons.reduce((a,r) => a + r.length, 0);
  const prev = (n.text||"").replace(/\s+/g," ").slice(0,70);
  const kb = n.buttons.map((row,r) => `<div class="krow${isRk?" rk":""}">${row.map((b,c) =>
      `<button class="kb" data-sa="btn" data-n="${id}" data-r="${r}" data-c="${c}">${esc(b.text)}<small>${btnInfo(cfg,b)}</small></button>`).join("")}
      ${row.length<3 ? `<button class="kb add" data-sa="newbtn" data-n="${id}" data-r="${r}"><i class='ic ic-plus'></i></button>` : ""}</div>`).join("");
  return `
    <div class="card nd${open?" open":""}${rise?" rise":""}" style="--i:${Math.min(i,8)}">
      <div class="nh" role="button" tabindex="0" aria-expanded="${open}" data-sa="toggle" data-n="${id}">
        <div class="nr"><div class="nt"><b>${esc(titleOf(cfg,id))}</b><span class="ns">${esc(prev)}</span></div>${CHEV}</div>
        <div class="nm">${tags.map(t=>`<span class="tag">${t}</span>`).join("")}<span class="tag cnt">${nb ? fa(nb)+" دکمه" : "بدون دکمه"}</span></div>
      </div>
      <div class="nbody"><div><div class="nbi">
        <div class="bubble" data-sa="node" data-n="${id}">${esc(n.text)}<span class="pen"><i class='ic ic-pen'></i></span></div>
        ${n.fields ? `<div class="muted" style="margin-top:6px">سؤال‌ها: ${n.fields.map((q,i) => esc(q) + (n.save?.[i] ? ' <span class="tag" dir="ltr">{' + esc(n.save[i]) + '}</span>' : "")).join(" <i class='ic ic-arrowl'></i>")}</div>` : ""}
        ${isRk ? `<div class="tray">${kb}</div>` : kb}
        ${n.buttons.length<6 ? `<button class="kb add wide" data-sa="newrow" data-n="${id}"><i class='ic ic-plus'></i>دکمه‌ی جدید</button>` : ""}
      </div></div></div>
    </div>`;
}

/* ───────── تایپ تدریجی توضیح هوش مصنوعی ───────── */
function typeText(el, text){
  const id = ++typeText.id;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){ el.textContent = text; return; }
  let i = 0; el.textContent = "";
  (function step(){
    if(id !== typeText.id || !el.isConnected) return;
    i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i);
    if(i < text.length) setTimeout(step, 16);
  })();
}
typeText.id = 0;

  const arr = D[list];

    ${hint ? `<p class="muted" style="margin:-3px 0 6px">${hint}</p>` : ""}${arr.map((o,i) => ruleHTML(list, o, i, cfg)).join("")}`;
}
function readRl(list){
  const rows = [...document.querySelectorAll(`.rl[data-list="${list}"]`)];
  if(!rows.length || !D[list]) return;
  D[list] = rows.map((r,i) => {
    const o = {...(D[list][i] || {})}, q = s => r.querySelector(s);
    if(q(".c-var")) o.c = {var:cleanVar(q(".c-var").value), op:q(".c-op").value, value:q(".c-val")?.value ?? ""};
    if(q(".r-goto")) o.goto = q(".r-goto").value;
    if(q(".r-text")) o.text = q(".r-text").value;
    if(q(".a-op")){
      o.op = q(".a-op").value;
      o.var = q(".a-var") ? cleanVar(q(".a-var").value) : (o.var || "");
      o.value = q(".a-val") ? q(".a-val").value : (o.value || "");
    }
    return o;
  });
}
function ruleErr(){
  const empty = c => c && simpleCond(c) && !c.var;
  for(const a of D.do || []){
    if(a.op === "notify"){ if(!(a.value || "").trim()) return "متن اعلانِ اکشن «به من خبر بده» رو بنویس"; }
    else if(!a.var) return "اسم متغیرِ اکشن رو بنویس";
  }
  for(const r of D.route || []) if(empty(r.c)) return "برای هدایت شرطی، اسم متغیرِ شرط رو بنویس";
  for(const r of D.alt || []){
    if(empty(r.c)) return "برای متن جایگزین، اسم متغیرِ شرط رو بنویس";
    if(!(r.text || "").trim()) return "متن جایگزین نباید خالی باشه";
  }
  for(const r of D.when || []) if(empty(r.c)) return "برای نمایش شرطیِ دکمه، اسم متغیرِ شرط رو بنویس";
  return null;
}
const outActs = l => l.map(a => a.op === "notify" ? {op:"notify", value:a.value || ""} : a.op === "clear" ? {op:"clear", var:a.var} : {op:a.op, var:a.var, value:a.value || ""});

function readNode(){
  const g = s => $(s)?.value ?? null;
  D.title = g("#f-title") ?? D.title; D.text = g("#f-text") ?? D.text; D.photo = g("#f-photo") ?? D.photo; D.mtype = g("#f-mtype") ?? D.mtype; D.aisys = g("#f-aisys") ?? D.aisys;
  if($("#f-aimem")) D.aimem = +$("#f-aimem").value; if($("#f-ailim")) D.ailim = Math.max(1, Math.min(100, +$("#f-ailim").value || 20));
  D.mode = g("#f-mode") ?? D.mode;
  const fq = [...document.querySelectorAll(".fq")];
  if(fq.length) D.fields = fq.map(r => ({q:r.querySelector(".fld").value, v:cleanVar(r.querySelector(".fv").value), t:r.querySelector(".ft").value}));
  if($("#f-silent")) D.silent = $("#f-silent").checked;
  if($("#f-done")){ D.done = g("#f-done"); D.next = g("#f-next") ?? D.next; }
  if($("#f-start") && !$("#f-start").disabled) D.start = $("#f-start").checked;
  if($("#f-fb") && !$("#f-fb").disabled) D.fb = $("#f-fb").checked;
  for(const l of ["do","route","alt"]) readRl(l);
  const ad = document.querySelector("details.adv"); if(ad) D.adv = ad.open;
}
function saveNode(){
  const id = S.sheet.id;
  if(!D.text.trim()) return toast("متن پیام نباید خالی باشه");
  if(D.mode==="form" && !D.fields.some(f => f.q.trim())) return toast("حداقل یک سؤال برای فرم بنویس");
  if(D.mode==="ai" && !D.aisys.trim()) return toast("دستورالعمل هوش مصنوعی رو بنویس");
  if(D.mode==="ai" && !S.cur.config.nodes[id].buttons.length) return toast("اول یه دکمه‌ی بازگشت به این بخش اضافه کن تا کاربر بتونه از گفتگو خارج بشه");
  if(D.mode==="show" && D.kb==="reply" && !S.cur.config.nodes[id].buttons.length) return toast("برای کیبورد زیر چت اول یه دکمه به این بخش اضافه کن");
  const err = ruleErr(); if(err) return toast(err);
  busy($('[data-sh="save"]'), () => commit(cfg => {
    const n = cfg.nodes[id];
    for(const k of ["title","photo","media","ai","ask","fields","save","types","silent","done","next","kb","do","route","alt"]) delete n[k];
    if(D.mode==="show" && D.kb==="reply") n.kb = "reply";
    n.text = D.text.trim();
    if(D.title.trim()) n.title = D.title.trim();
    if(D.photo.trim()) n.media = {type:D.mtype, url:D.photo.trim()};
    if(D.mode==="ai") n.ai = {system:D.aisys.trim(), memory:D.aimem, limit:D.ailim};
    if(D.mode==="ask") n.ask = true;
    if(D.mode==="form"){
      const fl = D.fields.filter(f => f.q.trim());
      n.fields = fl.map(f => f.q.trim());
      if(fl.some(f => f.v)) n.save = fl.map(f => f.v);
      if(fl.some(f => f.t !== "text")) n.types = fl.map(f => f.t);
      if(D.silent) n.silent = true;
    }
    if(D.mode==="form" || D.mode==="ask"){ if(D.done.trim()) n.done = D.done.trim(); if(D.next) n.next = D.next; }
    else if(D.mode==="ai" && D.done.trim()) n.done = D.done.trim();
    if(D.do.length) n.do = outActs(D.do);
    if(D.route.length) n.route = D.route.map(r => ({when:r.c, goto:r.goto}));
    if(D.alt.length) n.alt = D.alt.map(r => ({when:r.c, text:r.text.trim()}));
    if(D.start) cfg.start = id;
    if(D.fb) cfg.fallback = id;
  }));
}
function delNode(){
  const id = S.sheet.id;
  const go = ok => ok && busy($('[data-sh="del"]'), () => commit(cfg => {
    delete cfg.nodes[id];
    for(const n of Object.values(cfg.nodes)){
      n.buttons = n.buttons.map(r => r.filter(b => b.goto !== id)).filter(r => r.length);
      if(n.next === id) delete n.next;
      if(n.route){ n.route = n.route.filter(r => r.goto !== id); if(!n.route.length) delete n.route; }
    }
    for(const k of Object.keys(cfg.commands||{})) if(cfg.commands[k] === id) delete cfg.commands[k];
  }, "بخش حذف شد"));
  const q = "این بخش و دکمه‌هایی که بهش وصلن حذف بشن؟";
  tg?.showConfirm ? tg.showConfirm(q, go) : go(confirm(q));
}
function addNode(){
  const cfg = S.cur.config, ids = Object.keys(cfg.nodes);
  if(ids.length >= 40) return toast("حداکثر 40 بخش");
  let k = ids.length + 1; while(cfg.nodes["page_"+k]) k++;
  const id = "page_"+k;
  S.open.add(id);
  busy($('[data-sa="addnode"]'), async () => {
    await commit(c => { c.nodes[id] = {title:"بخش جدید", text:"متن این بخش رو بنویس", ask:false,
      buttons:[[{text:"منوی اصلی", goto:c.start}]]}; }, "بخش اضافه شد");
    openNode(id);
  });
}

function readBot(){
  D.name = $("#s-name")?.value ?? D.name; D.channels = $("#s-chs")?.value ?? D.channels; D.jtext = $("#s-jtext")?.value ?? D.jtext;
  const ns = [...document.querySelectorAll(".cmdn")], vs = [...document.querySelectorAll(".cmdv")];
  if(ns.length || document.querySelector("#s-name")) D.cmds = ns.map((n,i) => [n.value, vs[i].value]);
  if(document.querySelector("#s-name")){
    const vn = [...document.querySelectorAll(".vn")], vd = [...document.querySelectorAll(".vd")];
    D.vars = vn.map((n,i) => [cleanVar(n.value), vd[i].value]);
  }
}
function saveBot(){
  const d = D, chs = d.channels.split(/[\s,،]+/).filter(Boolean);
  busy($('[data-sh="save"]'), () => commit(cfg => {
    cfg.name = d.name.trim() || "ربات من";
    if(chs.length) cfg.join = {channels:chs, text:d.jtext.trim()}; else delete cfg.join;
    cfg.commands = {};
    d.cmds.forEach(([k,v]) => { k = k.trim().replace(/^\//,"").toLowerCase(); if(k) cfg.commands[k] = v; });
    const vars = {};
    d.vars.forEach(([k,v]) => { if(k) vars[k] = v.trim(); });
    if(Object.keys(vars).length) cfg.vars = vars; else delete cfg.vars;
  }));
}

/* ── هماهنگی شیت‌ها ── */
function renderSheet(){
  showSheet({node:nodeSheet, btn:btnSheet, bot:botSheet}[S.sheet.kind]());
}
function readSheet(){ ({node:readNode, btn:readBtn, bot:readBot}[S.sheet.kind])(); }

function shAction(a, ds){
  if(!S.sheet) return;
  const prev = D.kind;
  readSheet();
  if(a==="save") return {node:saveNode, btn:saveBtn, bot:saveBot}[S.sheet.kind]();
  if(a==="del") return S.sheet.kind==="node" ? delNode() : delBtn();
  if(a==="bkind"){
    const k = D.kind, wasText = prev==="channel"||prev==="url";
    if(k==="channel"){ const m = CH_RE.exec(D.val) || NAME_RE.exec(D.val); D.val = m ? "@"+m[1] : ""; }
    else if(k==="url"){ D.val = NAME_RE.test(D.val) ? "https://t.me/"+D.val.replace("@","") : (wasText ? D.val : ""); }
    else if(k!=="goto" && prev!==k) D.val = "";
  }
  else if(a==="kbt") D.kb = ds.v;
  else if(a==="addfld") D.fields.push({q:"", v:"", t:"text"});
  else if(a==="delfld") D.fields.splice(+ds.i, 1), D.fields.length || D.fields.push({q:"", v:"", t:"text"});
  else if(a==="addcmd") D.cmds.push(["help", S.cur.config.start]);
  else if(a==="delcmd") D.cmds.splice(+ds.i, 1);
  else if(a==="addvar") D.vars.push(["", ""]);
  else if(a==="delvar") D.vars.splice(+ds.i, 1);
  else if(a==="addrl"){ D[ds.l].push(newRule(ds.l)); D.adv = true; }
  else if(a==="delrl"){ D[ds.l].splice(+ds.i, 1); D.adv = true; }
  renderSheet();
}

document.addEventListener("click", e => {
  const x = e.target.closest("[data-x],[data-sa],[data-sh]"); if(!x || x.tagName==="SELECT") return;
  const ds = x.dataset;
  if(ds.x) return closeSheet();
  if(ds.sh) return shAction(ds.sh, ds);
  const r = ds.r !== undefined ? +ds.r : null;
  if(ds.sa==="node") openNode(ds.n);
  else if(ds.sa==="btn") openBtn(ds.n, r, +ds.c);
  else if(ds.sa==="newbtn") openBtn(ds.n, r, null);
  else if(ds.sa==="newrow") openBtn(ds.n, null, null);
  else if(ds.sa==="bot") openBot();
  else if(ds.sa==="addnode") addNode();
  else if(ds.sa==="toggle") toggleNode(ds.n, x);
  else if(ds.sa==="toggleall") toggleAll();
});
document.addEventListener("keydown", e => {
  const h = e.target.closest?.('[data-sa="toggle"]');
  if(h && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); toggleNode(h.dataset.n, h); }
});
document.addEventListener("change", e => {
  const a = e.target.dataset.sh;
  if(a==="mode" || a==="bkind" || a==="re") shAction(a, e.target.dataset);
});

async function busy(btn, fn){
  if(S.busy) return; S.busy = true;
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = old + '<span class="spin"></span>';
  try{ await fn(); }catch(e){ toast(e.message); if(e.status === 402) setTimeout(() => go("profile"), 1500); }
  S.busy = false; if(btn.isConnected){ btn.disabled = false; btn.innerHTML = old; }
}

function generate(){
  const btn = $("#gen"), ta = $("#prompt"), p = ta.value.trim();
  if(p.length < 5) return toast("توضیح بیشتری بنویس");
  busy(btn, async () => {
    ta.readOnly = true; startLive();
    try{
      const d = await api("/api/generate","POST",{ prompt:p, bot_id:S.cur?.id });
      const wasActive = S.cur?.active;
      S.cur = d.bot; S.bal = d.bal; S.fresh = true; stopLive(); render();
      toast((wasActive ? "ربات ارتقا پیدا کرد " : "ربات ساخته شد ") + ` · ${fa(d.cost)} توکن`);
      tg?.HapticFeedback?.notificationOccurred("success");
    } finally { stopLive(); ta.readOnly = false; }
  });
}

/* ───────── نوار پایین ───────── */
const dock = $("#dock");
let dockOpen = true;
try{ dockOpen = localStorage.getItem("dockOpen") !== "0"; }catch(_){}
function setDock(o, save = true){
  dockOpen = o; dock.classList.toggle("closed", !o); document.body.classList.toggle("dock-closed", !o);
  $("#dockTab").setAttribute("aria-expanded", o);
  if(save) try{ localStorage.setItem("dockOpen", o ? "1" : "0"); }catch(_){}
}
function syncDock(){
  document.querySelectorAll(".dn").forEach(el => el.classList.toggle("on", el.dataset.d === ({profile:"profile", explore:"explore"}[S.view] || "bots")));
}
function go(where){

  else if(where === "explore"){ if(S.view !== "explore"){ S.view = "explore"; S.cur = null; render(); } }
  else if(S.view !== "list"){ S.view = "list"; S.cur = null; S.open = new Set(); load(); }
  scrollTo({top:0, behavior:"smooth"});
  tg?.HapticFeedback?.selectionChanged();
}
let py = null;
dock.addEventListener("pointerdown", e => { py = e.clientY; });
dock.addEventListener("pointercancel", () => { py = null; });
dock.addEventListener("pointerup", e => {
  if(py === null) return;
  const dy = e.clientY - py; py = null;
  if(dy > 24) setDock(false); else if(dy < -24) setDock(true);
  else if(e.target.closest("#dockTab")) setDock(!dockOpen);
});
dock.addEventListener("click", e => { const n = e.target.closest("[data-d]"); if(n) go(n.dataset.d); });
document.addEventListener("focusin", e => { if(e.target.matches?.("input,textarea,select")) dock.classList.add("hide"); });
document.addEventListener("focusout", () => setTimeout(() => {
  if(!document.activeElement?.matches?.("input,textarea,select")) dock.classList.remove("hide");
}, 150));
setDock(dockOpen, false);

/* ───────── اکسپلور ───────── */
const XP = { sort: "hot", items: [], more: false, tok: 0, seen: new Set(), q: [], io: null };
const hueOf = id => [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
const kfmt = n => n >= 1e6 ? fa((n / 1e6).toFixed(1).replace(/\.0$/, "")) + " م" : n >= 1000 ? fa((n / 1000).toFixed(1).replace(/\.0$/, "")) + " هزار" : fa(n);
const xAv = (name, id, av) => `<span class="xav" style="--h:${hueOf(id)}">${esc((name || "?").trim().charAt(0))}${av ? `<img src="${API_BASE}/xp/avatar/${id}?v=${av}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>`;
const xStats = it => `<div class="xs"><span title="بازدید"><i class="ic ic-eye"></i>${kfmt(it.v)}</span><span title="استارت"><i class="ic ic-play"></i>${kfmt(it.s)}</span></div>`;
const likeBtn = it => `<button class="xb xlike${it.liked ? " on" : ""}" data-xp="like" data-id="${it.id}" aria-pressed="${!!it.liked}" aria-label="لایک"${it.mine ? " disabled" : ""}><i class="ic ${it.liked ? "ic-heartf" : "ic-heart"}"></i><span>${kfmt(it.l)}</span></button>`;

function xCard(it, i){
  const feat = XP.sort !== "new" && it.rank === 1, hot = XP.sort === "hot" && it.rank > 1 && it.rank <= 5;
  const badge = feat ? `<span class="xbd"><i class="ic ic-flame"></i>${XP.sort === "hot" ? "داغ‌ترین" : "محبوب‌ترین"}</span>`
    : hot ? `<span class="xbd"><i class="ic ic-flame"></i>داغ</span>`
    : it.mine ? `<span class="xbd m">ربات تو</span>` : it.new ? `<span class="xbd n">جدید</span>` : "";
  return `<article class="xc rise${feat ? " feat" : ""}${hot ? " hot" : ""}" data-id="${it.id}" style="--i:${Math.min(i, 8)}">
    ${badge}
    <div class="xt">${xAv(it.name, it.id, it.av)}<div class="xn"><b>${esc(it.name)}</b><span class="un">@${esc(it.username)}</span></div></div>
    <p class="xd">${esc(it.desc)}</p>
    ${xStats(it)}
    <div class="xa"><button class="xb xstart" data-xp="start" data-id="${it.id}">شروع<i class="ic ic-play" style="margin:0 0 0 0"></i></button>${likeBtn(it)}</div>
  </article>`;
}
const xSkel = () => `<div class="xc sk"><div class="xt"><span class="xav"></span><div class="xn"><i style="width:70%"></i></div></div><i></i><i style="width:60%"></i><i style="width:45%"></i></div>`;

function renderExplore(){
  const tabs = [["hot", "flame", "داغ‌ترین"], ["new", "spark", "جدیدترین"], ["top", "heart", "محبوب‌ترین"]];
  $("#app").innerHTML = `
    <div class="xhd"><div><h2><i class="ic ic-compass"></i>اکسپلور</h2><span class="xsub">ربات‌های بقیه رو ببین، امتحان کن و لایک بزن</span></div>
      <button class="xb xref" data-xp="refresh" aria-label="تازه‌سازی"><i class="ic ic-refresh"></i></button></div>
    <div class="xtabs" role="tablist">${tabs.map(([k, ic, t]) => `<button class="xb${XP.sort === k ? " on" : ""}" role="tab" aria-selected="${XP.sort === k}" data-xp="sort" data-k="${k}"><i class="ic ic-${ic}"></i>${t}</button>`).join("")}</div>
    <div class="xgrid" id="xgrid"></div><div id="xmore"></div>`;
  loadExplore(true);
}

async function loadExplore(reset){
  const tok = ++XP.tok, grid = $("#xgrid"); if(!grid) return;
  if(reset){ XP.items = []; grid.innerHTML = xSkel() + xSkel() + xSkel() + xSkel(); $("#xmore").innerHTML = ""; }
  try{
    const d = await api(`/api/explore?sort=${XP.sort}&offset=${XP.items.length}`);
    if(tok !== XP.tok || S.view !== "explore") return;
    const start = XP.items.length; XP.items = XP.items.concat(d.items); XP.more = d.more;
    if(reset) grid.innerHTML = "";
    if(!XP.items.length){
      grid.innerHTML = `<div class="card xempty" style="grid-column:1/-1"><i class="ic ic-compass"></i><b>اکسپلور هنوز خالیه</b><p class="muted">ربات خودت رو فعال کن و از صفحه‌ی ربات، اولین کارت اکسپلور رو بساز.</p></div>`;
      return;
    }
    grid.insertAdjacentHTML("beforeend", d.items.map((it, i) => xCard(it, i)).join(""));
    $("#xmore").innerHTML = XP.more ? `<button class="ghost xmore" data-xp="more">نمایش بیشتر</button>` : "";
    xObserve();
  }catch(e){
    if(tok !== XP.tok) return;
    grid.innerHTML = `<div class="card xempty" style="grid-column:1/-1"><p class="muted">${esc(e.message)}</p><button class="ghost" data-xp="refresh" style="margin-top:10px">دوباره امتحان کن</button></div>`;
  }
}

/* بازدید: وقتی کارت واقعاً روی صفحه دیده شد (هر نفر روزی یک‌بار، صاحب ربات حساب نمی‌شه) */
function xObserve(){
  XP.io?.disconnect();
  XP.io = new IntersectionObserver(es => es.forEach(e => {
    if(!e.isIntersecting) return;
    XP.io.unobserve(e.target);
    const id = e.target.dataset.id, it = XP.items.find(x => x.id === id);
    if(it && !it.mine && !XP.seen.has(id)){ XP.seen.add(id); XP.q.push(id); clearTimeout(XP.t); XP.t = setTimeout(xFlush, 1200); }
  }), {threshold: .6});
  document.querySelectorAll("#xgrid .xc[data-id]").forEach(el => XP.io.observe(el));
}
function xFlush(){ const ids = XP.q.splice(0, 20); if(ids.length) api("/api/explore/view", "POST", {ids}).catch(() => {}); }

function xStart(id){
  const it = XP.items.find(x => x.id === id); if(!it) return;
  const url = `https://t.me/${it.username}?start=ex`;
  tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank");
}
async function xLike(id){
  const it = XP.items.find(x => x.id === id); if(!it || it.mine) return;
  const was = it.liked; it.liked = !was; it.l += was ? -1 : 1; xSyncLike(it, true);
  tg?.HapticFeedback?.impactOccurred("light");
  try{ const d = await api(`/api/explore/${id}/like`, "POST"); it.liked = d.liked; it.l = d.likes; }
  catch(e){ it.liked = was; it.l += was ? 1 : -1; toast(e.message); }
  xSyncLike(it, false);
}
function xSyncLike(it, pop){
  document.querySelectorAll(`.xlike[data-id="${it.id}"]`).forEach(b => {
    b.outerHTML = likeBtn(it);
  });
  if(pop) document.querySelectorAll(`.xlike[data-id="${it.id}"]`).forEach(b => { if(it.liked){ b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 500); } });
}

function xOpen(id){
  const it = XP.items.find(x => x.id === id); if(!it) return;
  S.sheet = {kind: "xp"};
  showSheet(head('اکسپلور') + `
    <div class="xsheet-top"><div class="xt">${xAv(it.name, it.id, it.av)}<div class="xn"><b>${esc(it.name)}</b><span class="un">@${esc(it.username)}</span></div></div></div>
    ${it.desc ? `<p class="xsheet-desc">${esc(it.desc)}</p>` : ""}
    <div class="xbig"><div><b>${kfmt(it.v)}</b><small>بازدید</small></div><div><b>${kfmt(it.l)}</b><small>لایک</small></div><div><b>${kfmt(it.s)}</b><small>استارت</small></div></div>
    <div class="xsheet-act"><button class="xb xstart" data-xp="start" data-id="${it.id}">شروع و امتحان ربات<i class="ic ic-play" style="margin:0 6px 0 0"></i></button>${likeBtn(it)}</div>
    <div class="xlinks">${it.mine ? "" : `<button class="xb" data-xp="report" data-id="${it.id}"><i class="ic ic-flag"></i>گزارش</button>`}${S.isAdmin ? `<button class="xb dg" data-xp="adm" data-id="${it.id}"><i class="ic ic-trash"></i>حذف از اکسپلور</button>` : ""}</div>`);
}

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-xp]");
  if(!b){
    const c = e.target.closest("#xgrid .xc[data-id]");
    if(c) xOpen(c.dataset.id);
    return;
  }
  const a = b.dataset.xp, id = b.dataset.id;
  if(a === "sort"){ XP.sort = b.dataset.k; renderExplore(); }
  else if(a === "refresh"){ b.classList.add("spin"); XP.seen.clear(); await loadExplore(true); b.classList.remove("spin"); }
  else if(a === "more"){ b.disabled = true; await loadExplore(false); }
  else if(a === "start") xStart(id);
  else if(a === "like") xLike(id);
  else if(a === "report"){
    const go = async ok => { if(!ok) return; try{ await api(`/api/explore/${id}/report`, "POST"); toast("گزارشت ثبت شد، ممنون"); closeSheet(); }catch(err){ toast(err.message); } };
    tg?.showConfirm ? tg.showConfirm("این ربات رو گزارش می‌کنی؟", go) : go(confirm("گزارش بشه؟"));
  }
  else if(a === "adm"){
    try{ await api(`/api/admin/explore/${id}`, "POST", {hide: true}); XP.items = XP.items.filter(x => x.id !== id); document.querySelector(`#xgrid .xc[data-id="${id}"]`)?.remove(); closeSheet(); toast("از اکسپلور برداشته شد"); }
    catch(err){ toast(err.message); }
  }
});

/* ── کارت اکسپلور توی صفحه‌ی ربات (برای صاحب ربات) ── */
const xDefault = b => ((b.config.nodes[b.config.start]?.text) || "").replace(/\{[^{}]*\}/g, "").replace(/\s+/g, " ").trim().slice(0, 90);
function xPrev(b, desc){
  const x = b.explore || {};
  return `<article class="xc"><div class="xt">${xAv(b.name, b.id, x.av)}<div class="xn"><b>${esc(b.name)}</b><span class="un">@${esc(b.username)}</span></div></div>
    <p class="xd" id="xpd">${esc(desc)}</p>
    ${xStats({v: x.v || 0, s: x.s || 0})}
    <div class="xa"><span class="xb xstart" style="background:var(--ac);color:var(--act);font-weight:600">شروع<i class="ic ic-play" style="margin:0"></i></span><span class="xb xlike"><i class="ic ic-heart"></i><span>${kfmt(x.l || 0)}</span></span></div></article>`;
}
function xoHTML(b){
  const x = b.explore || {};
  return `<div class="card xo" id="xo">
    <h2><i class="ic ic-compass"></i>اکسپلور${x.on ? `<span class="tag on">فعال</span>` : ""}</h2>
    <p class="muted" style="margin-bottom:12px">${x.hidden ? "این ربات توسط ادمین از اکسپلور برداشته شده." : "ربات رو با یه کارت ظریف توی ویترین عمومی بذار تا بقیه ببیننش، لایک کنن و استارتش بزنن."}</p>
    ${x.hidden ? "" : `<div class="xprev">${xPrev(b, x.desc || xDefault(b) || "—")}</div>
      <textarea id="xdesc" maxlength="90" placeholder="توضیح کوتاه برای کارت (لینک و آیدی حذف می‌شن)">${esc(x.desc || "")}</textarea>
      <div class="xcnt"><span id="xcn">${fa((x.desc || "").length)}/${fa(90)}</span></div>
      <button id="xsave">${x.on ? "ذخیره و به‌روزرسانی عکس" : "اضافه به اکسپلور"}</button>
      ${x.on ? `<button class="ghost" id="xoff" style="margin-top:8px">برداشتن از اکسپلور</button>` : ""}`}
  </div>`;
}
function bindXo(){
  const t = $("#xdesc"); if(!t) return;
  const b = S.cur;
  t.addEventListener("input", () => { $("#xcn").textContent = `${fa(t.value.length)}/${fa(90)}`; const d = $("#xpd"); if(d) d.textContent = t.value.trim() || xDefault(b) || "—"; });
  const save = (on, btn) => busy(btn, async () => {
    const d = await api(`/api/bots/${b.id}/explore`, "POST", {on, desc: t.value});
    S.cur = d.bot; const i = S.bots.findIndex(x => x.id === d.bot.id); if(i >= 0) S.bots[i] = d.bot;
    $("#xo").outerHTML = xoHTML(S.cur); bindXo();
    toast(on ? "توی اکسپلور قرار گرفت" : "از اکسپلور برداشته شد");
    tg?.HapticFeedback?.notificationOccurred("success");
  });
  $("#xsave").onclick = () => save(true, $("#xsave"));
  $("#xoff")?.addEventListener("click", () => save(false, $("#xoff")));
}


/* ───────── ابزارهای جدید: ورودی/خروجی، کپی، سلامت‌سنجی، نمونه‌ها ───────── */
const EXAMPLES = [
  ["فروشگاه", "ربات فروشگاه لوازم جانبی موبایل با منوی محصولات، قیمت و فرم ثبت سفارش"],
  ["پشتیبانی", "ربات پشتیبانی مشتری با سؤال‌های پرتکرار و ارسال پیام به پشتیبان"],
  ["باشگاه امتیاز", "ربات باشگاه مشتریان با جایزه‌ی روزانه، امتیاز و سطح‌بندی طلایی"],
  ["کوییز", "ربات کوییز ۵ سؤالی با امتیازدهی و نتیجه‌ی نهایی"]
];
const HEALTH_FA = [["unreachable nodes", "بخش‌های بدون مسیر ورود"], ["dead-end nodes", "بن‌بست‌ها (دکمه‌ی بازگشت ندارن)"], ["variables that are read", "متغیرهای بدون مقدار"]];
function textSheet(title, text, hint){

  showSheet(head(title) + (hint ? `<p class="muted" style="margin-bottom:8px">${hint}</p>` : "") +
    `<textarea id="tx-out" readonly dir="ltr" style="min-height:220px;font-family:var(--mono);font-size:12px"></textarea>
     <div style="height:10px"></div><button data-tl="copyout"><i class='ic ic-copy'></i>کپی</button>`);

function csvOf(items){

    [r.t, r.title, r.name, r.un, (r.qa || []).map(([a, b]) => a + ": " + b).join(" | ") || r.text].map(q).join(","))].join("\n");
}
document.addEventListener("click", e => {
  const ex = e.target.closest("[data-ex]");

  else if(a === "health") busy(x, async () => {

  });
  else if(a === "export") busy(x, async () => { const d = await api(`/api/bots/${S.cur.id}/export`); textSheet("خروجی JSON", JSON.stringify(d.config, null, 2), "این متن رو نگه دار؛ هر وقت خواستی از «ورود از JSON» برگردونش."); });
  else if(a === "csv") busy(x, async () => { const d = await api(`/api/bots/${S.cur.id}/submissions`); if(!d.items.length) return toast("هنوز پاسخی ثبت نشده"); textSheet("خروجی CSV", csvOf(d.items), "آخرین ۵۰ پاسخ. توی اکسل یا گوگل‌شیت پیست کن."); });
  else if(a === "dup") busy(x, async () => { const d = await api(`/api/bots/${S.cur.id}/duplicate`, "POST"); S.cur = d.bot; S.open = new Set(); render(); scrollTo({top:0}); toast("کپی ساخته شد"); });
  else if(a === "import"){
    S.sheet = {kind:"info"};
    showSheet(head("ورود از JSON") + `<p class="muted" style="margin-bottom:8px">خروجی JSON یه ربات رو اینجا بچسبون تا به‌عنوان ربات جدید ساخته بشه.</p>
      <textarea id="im-text" dir="ltr" style="min-height:200px;font-family:var(--mono);font-size:12px" placeholder='{"name": "...", "nodes": {...}}'></textarea>
      <div style="height:10px"></div><button data-tl="importgo"><i class='ic ic-upload'></i>ساخت ربات</button>`);
  }
  else if(a === "importgo") busy(x, async () => {
    let c; try{ c = JSON.parse($("#im-text").value); }catch(_){ return toast("JSON معتبر نیست"); }
    const d = await api("/api/bots/import", "POST", {config: c.config || c});
    closeSheet(); S.cur = d.bot; S.view = "bot"; S.open = new Set(); render(); toast("ربات وارد شد");
  });
});

/* ───────── حضور آنلاین و فهرست کاربران (ادمین) ───────── */
if(INIT){
  const ping = () => { if(!document.hidden) api("/api/ping", "POST").catch(() => {}); };
  setInterval(ping, 25000);
  document.addEventListener("visibilitychange", ping);
}
let UQ = "";
const ago = t => { if(!t) return "—"; const m = Math.max(0, (Date.now() - new Date(t)) / 60000);
  return m < 1 ? "just now" : m < 60 ? Math.floor(m) + " min ago" : m < 1440 ? Math.floor(m / 60) + " h ago" : Math.floor(m / 1440) + " d ago"; };
function userRow(r){
  const nm = r.name || (r.un ? "@" + r.un : "—");
  const bots = r.bots.map(b => `<span class="ub${b.on ? " on" : ""}" dir="ltr">${b.on ? "@" + esc(b.un) : esc(b.name)}</span>`).join("");
  return `<div class="urow"><span class="dot${r.online ? " on" : ""}" title="${r.online ? "online" : ago(r.seen)}"></span>
    <div class="ui"><div class="u1"><b>${esc(nm)}</b>${r.un && r.name ? `<span class="muted" dir="ltr">@${esc(r.un)}</span>` : ""}</div>
      <div class="u2"><span class="cpy" data-pf="copyid" data-id="${r.id}" dir="ltr">${r.id}</span><span class="muted">${r.online ? "online" : ago(r.seen)}</span></div>
      ${bots ? `<div class="u3">${bots}</div>` : ""}</div>
    <span class="ucnt" title="bots">${fa(r.bots.length)}</span></div>`;
}
const uSum = d => `<span class="dot on"></span><b>${fa(d.online)}</b> online<span class="muted"> / ${fa(d.total)} users</span>`;
function uList(d){
  const q = UQ.trim().toLowerCase().replace(/^@/, "");
  const rows = d.items.filter(r => !q || String(r.id).includes(q) || (r.un || "").toLowerCase().includes(q) || (r.name || "").toLowerCase().includes(q)
    || r.bots.some(b => (b.un || "").toLowerCase().includes(q)));
  return rows.map(userRow).join("") || '<p class="muted">no match</p>';
}
async function openUsers(){
  S.sheet = {kind:"info"}; UQ = "";
  showSheet(head("کاربران ربات‌ساز") + `<p class="muted">در حال بارگذاری…</p>`);
  const tick = async () => {
    if(S.sheet?.kind !== "info" || !$("#sheet").classList.contains("show")) return clearInterval(openUsers.t);
    try{
      const d = await api("/api/admin/users"); openUsers.d = d;
      if($("#ulist")){ $("#usum").innerHTML = uSum(d); $("#ulist").innerHTML = uList(d); return; }
      showSheet(head("کاربران ربات‌ساز") + `<div class="usum" id="usum">${uSum(d)}</div>
        <input id="uq" placeholder="search id, username, bot" autocomplete="off" style="margin-bottom:6px"><div id="ulist">${uList(d)}</div>`);
    }catch(e){ closeSheet(); toast(e.message); }
  };
  clearInterval(openUsers.t); await tick(); openUsers.t = setInterval(tick, 10000);
}
document.addEventListener("input", e => {
  if(e.target.id !== "uq" || !openUsers.d) return;
  UQ = e.target.value; $("#ulist").innerHTML = uList(openUsers.d);
});

load();
</script>
</body>
</html>
