name: Engine registry contract tests

on:
  push:
    branches: ["agentic-builder-overhaul"]
  pull_request:
    branches: ["main"]

jobs:
  engine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile project
        run: python -m compileall -q .
      - name: Verify engine and registry contracts
        run: python -m unittest discover -s tests -p "test_engine_registry_contract.py" -v
