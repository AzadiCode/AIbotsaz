name: Builder deterministic audit tests

on:
  push:
    branches: ["agentic-builder-overhaul"]
  pull_request:
    branches: ["main"]

jobs:
  builder-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run deterministic builder audit tests
        run: python -m unittest discover -s tests -p "test_builder_agent.py" -v
