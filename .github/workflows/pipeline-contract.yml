name: Build pipeline safety contracts

on:
  push:
    branches: ["agentic-builder-overhaul"]
  pull_request:
    branches: ["main"]

jobs:
  pipeline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile project
        run: python -m compileall -q .
      - name: Verify approval, charging, rollback and repair contracts
        run: python -m unittest discover -s tests -p "test_build_pipeline_contract.py" -v
